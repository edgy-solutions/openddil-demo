# Edge-01 → HQ bridge (ADR-0023 Phase 6a).
# Consumer-group name is distinct per-edge so rpk group describe reads
# per-edge bridge lag without ambiguity.
input:
  kafka:
    addresses:
      - redpanda-edge-01:9092
    topics:
      - raw-sensor-stream
      - tactical-events
    consumer_group: "bridge-group-edge-01"

output:
  kafka:
    addresses:
      - toxiproxy:8474
    topic: "${! meta(\"kafka_topic\") }"
    max_retries: 0
