# taky 0.10 — the compose-only C2 stand-in for the CoT bridge (ADR-0043
# ledger row LR-0043-C). COMPOSE-ONLY SCAFFOLDING, same status as
# egress-gate-c2's image-borrowing: fine for proving the translation, not fine
# for anything that ships.
#
# Keys read from the INSTALLED taky==0.10 package (taky/config.py
# DEFAULT_CFG + load_config), not guessed:
#   - With no config file at all, taky already defaults to plaintext TCP CoT
#     on 8087 (ssl.enabled defaults False, and cot_server.port falls back to
#     8087 when unset and SSL is off — taky/config.py:90-92). This file exists
#     anyway so that "plaintext, port 8087" is a stated fact an operator can
#     read, not an inherited default they have to go verify in the package.
#   - taky/config.py:15 — [taky] root_dir must exist; the compose command
#     creates it before `taky` starts (see docker-compose.yml).
#   - taky/config.py:21-22 — [cot_server] port, mon_ip/mon_port (SSL monitor
#     port — left unset; it only activates when ssl.enabled is true).
#   - taky/config.py:28 — [ssl] enabled, set false explicitly.
[taky]
hostname = tak-server
bind_ip = 0.0.0.0
root_dir = /var/taky

[cot_server]
port = 8087

[ssl]
enabled = false
