  # SPARSE IS NOT EXPECTED-EMPTY, AND THE DIFFERENCE IS THE POINT.
  #
  # Every other entry in this file is the claim "nothing here produces that
  # data". This one is "this producer speaks rarely" -- and a rare speaker and
  # a dead one look identical from the table, which is exactly the confusion an
  # ordinary entry here would create rather than resolve.
  #
  # So `sparse: true` is CONDITIONAL. The gate permits an empty table only
  # while check-derive-stage.sh reports the producer completing invocations,
  # and refuses when it reports otherwise OR when nothing has measured
  # recently. Absence of evidence buys nothing.
  #
  # Same shape as the relay stall probe's `destination reachable` clause: an
  # absence is benign only when something else proves the source is alive.
  tactical_events:
    sparse: true
    reason: >-
      Tactical events fire on TRANSITIONS -- a configuration discrepancy
      appearing or clearing, a logistics severity changing band -- so a stable
      fleet emits none at all. cm-service deduplicates on last_alerted_status
      and will not re-emit while a status holds, which is correct and means
      quiet periods are the normal case rather than the exception.
      Combined with retention, the table is therefore empty for long stretches
      at every tier, and at the root most of all because it prunes soonest.
      DECLARING THIS PLAINLY EMPTY WOULD BE WRONG: the same declaration would
      explain away a fusion outage that had stopped the producer, which is the
      move this file's own header names as the thing it exists to make
      visible. The producer's liveness is the missing term, and it is measured
      rather than assumed.
      Declared 2026-09-18, after the root's copy read empty with the newest
      event 33h old against a 24h retention -- correct behaviour that the gate
      had no category for.


  asset_registry:
    stores: [tier]
    reason: >-
      The asset registry is a ROOT-SIDE component (ADR-0028): it holds the
      authoritative asset -> edge -> region lineage that the production
      warfighter system owns, and OpenDDIL never overrides that assignment.
      No tier projector has an asset-registry mapping at all, so a tier store
      has nothing that could write this table and its emptiness is structural
      rather than a stopped producer.
      SCOPED TO TIERS ON PURPOSE. The root's copy holds 14 rows and must keep
      being checked -- an unscoped declaration here would mean that the day
      the root's registry emptied, the gate that exists to notice it would be
      the thing explaining it away.
      Declared 2026-09-18, on the first --all-tiers run that reached this
      branch: the edge stores had been failing earlier on unlabelled rows, so
      nothing had ever asked the question at a tier.


  asset_telemetry_windows:
    reason: >-
      The windowing stage that would fill it is not producing here: the
      asset-telemetry-windows topic has a high-watermark of 0 on both the
      edge and HQ brokers, so nothing has ever been written to it. The table
      gained releasability columns in the 2026-09-06 labelling block and is
      SERVED rather than refused, because "no rows" is the accurate statement
      about it and "not served" was not.
    producer: asset-telemetry-windows topic (faust-edge windowing)
    declared_by: cnogradi
    declared_on: 2026-09-06

  inventory_items:
    reason: >-
      Nothing writes it in this deployment — the asset-element-inventory
      topic is at high-watermark 0 and no component emits to it. The frontend
      panel that would read it renders its own "not yet populated" copy
      rather than a shape, so its emptiness has never been a screen defect.
      Labelled and served for the same reason as above: empty is a fact about
      the data, refused was a fact about the read path.
    producer: asset-element-inventory topic
    declared_by: cnogradi
    declared_on: 2026-09-06

  asset_capability_state:
    reason: >-
      No weapons-capability feed is deployed here. This table is populated by
      a source-specific snapshot mapping (customer AMQP, DIS-derived, AFSim
      stores, Link 16 J3.7); the demo runs none of them, so the table is
      correctly empty rather than stalled.
    producer: asset-capability-snapshot topic
    declared_by: cnogradi
    declared_on: 2026-09-05

  asset_element_telemetry:
    reason: >-
      No asset in this fleet matches any logistics-sim profile, and the
      mismatch is STRUCTURAL rather than a matter of the sim being idle. The
      only shipped profile matches platform variants MRAD_Sensor / MRAD_Radar
      / MRAD2_radar AND requires the asset_id to end in `_Sensor`. The demo
      fleet is DIS-sourced, so its ids are `dis:<site>:<app>:<entity>` and can
      never carry that suffix — the per-element drill-down is unreachable from
      the DIS path by construction, not by configuration.
      .
      Populating it needs BOTH an ontology entry for a sensor entity type
      (an ADR-0016 ontology PR) AND a profile whose id filter the DIS naming
      can satisfy. Recorded rather than patched around: relaxing the suffix
      filter to make a table non-empty would be changing a producer's
      matching rule to satisfy a gate, which is the wrong direction of
      causation.
    producer: openddil-logistics-sim
    declared_by: cnogradi
    declared_on: 2026-09-05
