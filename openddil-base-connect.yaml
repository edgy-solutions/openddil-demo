logger:
  level: INFO
  format: logfmt
  add_timestamp: true

http:
  enabled: true
  address: 0.0.0.0:4196

# =============================================================================
# OSS Bronze → Silver translation pipeline (DIS + diagnostic HTTP only)
# =============================================================================
# Customer-feed Bronze topics (ingress-proprietary-raw, ingress-sim-a-raw)
# are handled by a SEPARATE Connect container that lives in the customer
# overlay (openddil-customer-bundle/connect/). The Bloblang mappings for
# those feeds embody customer-specific JSON shapes and live in the
# customer overlay — not in this OSS file.
#
# Both Connect containers publish to the SAME Silver topic raw-sensor-stream
# (multi-producer pattern); downstream consumers (faust-edge, cm-service,
# logistics-fusion-service) are feed-agnostic.
# =============================================================================

input:
  broker:
    inputs:
      # Production DIS Ingress (via binary sidecar → Kafka)
      - kafka_franz:
          seed_brokers: [ "${REDPANDA_BROKER:redpanda-edge-01:9092}" ]
          topics: [ "ingress-dis-raw" ]
          consumer_group: "connect-dis-mapper"
          start_from_oldest: true

      # Diagnostic HTTP Ingress (Port 9999)
      # Production DIS arrives via Kafka; HTTP is for diagnostic testing only.
      # HTTP payloads have no kafka_topic metadata, so they fall through
      # to sim_dis_mapping (the diagnostic uses DIS-shape JSON).
      - http_server:
          address: 0.0.0.0:9999
          path: /
          allowed_verbs: [ POST ]

pipeline:
  threads: 4
  processors:
    # Try block handles the main path
    - try:
      # The Kafka input delivers raw bytes; HTTP auto-parses JSON. Coerce both
      # to a parsed object before the resource mapping runs.
      - mapping: |
          root = if this.type() == "string" || this.type() == "bytes" {
            this.parse_json()
          } else {
            this
          }
      # TOP-OF-PIPELINE DIVERSION SWITCH. Three cases, checked in order, on
      # the parsed DIS-shape object:
      #
      #   1. event_report — a condition ABOUT an entity, not the entity's own
      #      state. See dynamic-mappings/dis-event-report.yaml. Its only sink
      #      is HTTP, so it deletes the record itself; nothing here reaches
      #      raw-sensor-stream.
      #   2. fire / detonation — a launch or impact event, not a platform's
      #      kinematics or health. See dynamic-mappings/dis-effector.yaml.
      #      Its only sink is Kafka, so the record survives unchanged (only
      #      a meta flag is set) and falls through to output.switch below.
      #   3. default (Entity State, Remove Entity) — the kind/force gates and
      #      sim_dis_mapping, moved into this arm so cases 1 and 2 never
      #      reach them: once sim_dis_mapping runs, `dis_entity_type.kind`
      #      has moved under `asset.` and gating there would be refusing
      #      something already built. See dynamic-mappings/dis-kind-gate.yaml
      #      and dynamic-mappings/dis-force-gate.yaml for why kind runs
      #      before force.
      - switch:
          - check: 'this.pdu_type.or("") == "event_report"'
            processors:
              - resource: "dis_event_report"

          - check: 'this.pdu_type.or("") == "fire" || this.pdu_type.or("") == "detonation" || this.pdu_type.or("") == "resupply_received"'
            processors:
              - resource: "dis_effector"

          - check: ""
            processors:
              - resource: "dis_kind_gate"
              - resource: "dis_force_gate"
              - resource: "sim_dis_mapping"
              - mapping: |
                  meta asset_id = this.asset.asset_id
              - protobuf:
                  operator: from_json
                  message: openddil.telemetry.v1.EntityTelemetryEvent
                  import_paths: [ "/proto" ]

    # Catch block handles malformed data or schema errors
    - catch:
      - log:
          level: WARN
          message: "Ingress Failure: ${! error() }"
      - mapping: |
          meta dlq_reason = error()
          meta dlq_stage = "schema_mapping_or_protobuf_encode"
          meta is_dlq = "true"

output:
  switch:
    cases:
      - check: meta("is_dlq") == "true"
        output:
          kafka_franz:
            topic: "ingress-dlq"
            seed_brokers: [ "${REDPANDA_BROKER:redpanda-edge-01:9092}" ]
      # Fire/Detonation records, diverted and flagged by dis_effector (see
      # dynamic-mappings/dis-effector.yaml). Same style as the raw-sensor-
      # stream case below, keyed by launcher_urn instead of asset_id since
      # the record is still JSON (never protobuf-encoded) and still carries
      # that field directly.
      - check: meta("is_effector") == "true"
        output:
          kafka_franz:
            seed_brokers: [ "${REDPANDA_BROKER:redpanda-edge-01:9092}" ]
            topic: "effector-events"
            key: '${! json("launcher_urn") }'
            max_in_flight: 64
      - output:
          kafka_franz:
            seed_brokers: [ "${REDPANDA_BROKER:redpanda-edge-01:9092}" ]
            topic: "raw-sensor-stream"
            key: '${! meta("asset_id") }'
            metadata:
              include_patterns: [ "ce_.*", "schema_.*" ]
            max_in_flight: 64
