# =============================================================================
# OpenDDIL Demo — developer override
# =============================================================================
# Docker Compose auto-merges this file on top of docker-compose.yml when
# both are present in the working directory (the default behavior of
# `docker compose up`). This file MUST own:
#   - every `build:` directive (the base compose pulls from a registry)
#   - every developer-only volume mount (live source bind-mounts for
#     hot-reload, generated proto bindings, ontology overlays)
#   - every `pull_policy: build`
#
# Skip this file in CI / customer-facing deployments by invoking compose
# explicitly:
#   docker compose -f docker-compose.yml up   # base only, all images pulled
#
# See AGENTS.md / llms.txt / .cursorrules in this repo for the underlying
# rule and the new-service checklist.
#
# INVARIANT (Phase 4d pull_policy audit) — every OpenDDIL-owned service
# (image: ghcr.io/edgy-solutions/openddil/...) MUST have BOTH:
#   - base docker-compose.yml: `pull_policy: always`  (consumers pull latest)
#   - this file:               `build:` + `pull_policy: build`  (devs build local)
# A service with base `pull_policy: always` and NO build override here
# has its local build silently discarded on every `docker compose up` —
# the bug found with the frontend in Phase 4b and audited as a class in
# 4d. Third-party images (redpanda, postgres, electric, toxiproxy, atlas,
# restate-server, redpanda-connect) correctly pull and need no override.
# =============================================================================
services:

  # --------------------------------------------------------------------------
  # DIS sidecar — local build + (no source mount needed; image-baked entry)
  # --------------------------------------------------------------------------
  openddil-sensor-ingest:
    build:
      context: ../openddil-sensor-ingest
      dockerfile: Dockerfile
    pull_policy: build

  # --------------------------------------------------------------------------
  # Faust edge — local build + mount source for hot-reload
  # --------------------------------------------------------------------------
  faust-edge:
    build:
      context: ../openddil-tactical-agents/edge
      dockerfile: Dockerfile
    pull_policy: build
    volumes:
      # Local code mounts for hot-reloading during development
      - ../openddil-tactical-agents/edge/faust_edge.py:/app/faust_edge.py
      - ../openddil-tactical-agents/edge/detection:/app/detection
      # Phase 5: prognostics derivation engine package (ADR-0020). Mounted
      # alongside detection/ — the one-line register call in faust_edge.py
      # imports it. Only agent.py inside this package imports faust.
      - ../openddil-tactical-agents/edge/prognostics:/app/prognostics
      - ../openddil-contracts/gen/python/openddil:/app/openddil
      - ../openddil-contracts/gen/python/google:/app/google
      - ../openddil-tactical-agents/edge/rules.yaml:/app/rules.yaml
    environment:
      # Phase 5 demo visibility-tuning. The honest-authored defaults live
      # in openddil-tactical-agents/edge/prognostics/coefficients.py
      # (5000 km / 5000 h / 1000 rounds / 100000 deg·km) — order-of-magnitude
      # reasonable for real tracked vehicles. The values below override them
      # so a few-km / few-minute scripted scenario actually crosses fusion's
      # wear thresholds and produces real constraining factors; without the
      # override the demo would show 100%-remaining for every model and
      # nothing severity-driven would happen. Rationale + framing: see
      # ADR-0020 "Methodology placeholders to name out loud" → "Coefficients
      # are compressed in the demo deployment for visibility." Different
      # artifacts for different purposes: the contract stays honest, the
      # demo stays visible.
      PROGNOSTICS_TRACK_LIFE_TOTAL_KM:     "10"
      PROGNOSTICS_ENGINE_LIFE_TOTAL_HOURS: "1"
      PROGNOSTICS_TERRAIN_TOTAL_DEG_KM:    "50"
      PROGNOSTICS_BARREL_LIFE_TOTAL_ROUNDS: "100"

  # --------------------------------------------------------------------------
  # CM service — local build + mount source for hot-reload + CLI helper
  # --------------------------------------------------------------------------
  cm-service:
    build:
      context: ../openddil-cm-service
      dockerfile: Dockerfile
    pull_policy: build
    volumes:
      # CLI helper for test-time CmEvent submission. Production images bake
      # cli/ in via Dockerfile COPY; dev mode mounts it for fast iteration.
      - ../openddil-cm-service/cli:/app/cli:ro
      # Source mount for hot-reload (overrides the COPY'd /app/src)
      - ../openddil-cm-service/src:/app/src

  cm-service-bootstrap:
    build:
      context: ../openddil-cm-service
      dockerfile: Dockerfile
    pull_policy: build
    volumes:
      # Source mount for the bootstrap wrapper (production bakes it in).
      - ../openddil-cm-service/bootstrap:/app/bootstrap:ro

  # --------------------------------------------------------------------------
  # Logistics fusion service — local build + source mount
  # --------------------------------------------------------------------------
  logistics-fusion-service:
    build:
      context: ../openddil-logistics-fusion-service
      dockerfile: Dockerfile
    pull_policy: build
    volumes:
      - ../openddil-logistics-fusion-service/src:/app/src

  logistics-fusion-bootstrap:
    build:
      context: ../openddil-logistics-fusion-service
      dockerfile: Dockerfile
    pull_policy: build
    volumes:
      - ../openddil-logistics-fusion-service/bootstrap:/app/bootstrap:ro

  # --------------------------------------------------------------------------
  # Redpanda Connect — ontology mount for dev iteration
  # --------------------------------------------------------------------------
  redpanda-connect:
    volumes:
      # Ontology lookup — read-only. Bloblang resolves DIS entity type triples here.
      # Update openddil-contracts/ontology/dis_entity_types.yaml to add new platform types.
      - ../openddil-contracts/ontology:/ontology:ro

  # --------------------------------------------------------------------------
  # Projector — local build + source mount for hot-reload (Phase 4a)
  # --------------------------------------------------------------------------
  openddil-projector:
    build:
      context: ../openddil-projector
      dockerfile: Dockerfile
    pull_policy: build
    volumes:
      # Source mount for hot-reload (overrides the COPY'd /app/src). The
      # generated proto stubs at /proto come from the base-compose mount.
      - ../openddil-projector/src:/app/src

  # --------------------------------------------------------------------------
  # Frontend — local build (Phase 4b)
  # --------------------------------------------------------------------------
  # The base compose pulls ghcr.io/edgy-solutions/openddil/frontend:latest
  # with `pull_policy: always`. Without this override, a developer editing
  # frontend source would have their local build silently replaced by the
  # registry image on every `docker compose up`. No source mount: the
  # frontend is an nginx-served static build, not hot-reloaded — rebuild
  # the image to pick up changes.
  frontend:
    build:
      context: ../openddil-demo/frontend
      dockerfile: Dockerfile
    pull_policy: build

  # --------------------------------------------------------------------------
  # Restate hub projector — local build (Phase 4d pull_policy audit)
  # --------------------------------------------------------------------------
  # The base compose pulls
  # ghcr.io/edgy-solutions/openddil/hub-restate-projector:latest with
  # `pull_policy: always` but had no build override — the bug class. The
  # base compose bind-mounts restate_hub.py for source hot-reload, so a
  # developer's *source* edits were fine, but Dockerfile / pyproject.toml
  # (dependency) changes were silently discarded on every up. The hub
  # Dockerfile's COPYs assume the repo root as context.
  restate-hub:
    build:
      context: ../openddil-tactical-agents
      dockerfile: hub/projector/Dockerfile
    pull_policy: build
