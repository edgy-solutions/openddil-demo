processor_resources:
  - label: sim_dis_mapping
    mapping: |
      # =========================================================================
      # PURE RESHAPING. No math beyond field selection and label attachment.
      # If you find yourself adding arithmetic here, STOP — that belongs in the
      # algorithm layer or in a typed conversion library, not in YAML.
      #
      # INPUT CONTRACT (from dis_ingestor.py → ingress-dis-raw):
      #   dis_entity_id:   {site, application, entity}
      #   entity_id_urn:   "dis:{site}:{application}:{entity}"
      #   dis_entity_type: {kind, domain, country, category, subcategory, specific, extra}
      #   marking:         string
      #   force_id:        int (1=friendly, 2=opposing, 3=neutral)
      #   location_ecef:   {x, y, z}  — metres
      #   linear_velocity_ecef: {x, y, z}  — m/s
      #   orientation_euler:    {psi, theta, phi}  — radians
      #
      # SUSTAINMENT NOTE: DIS Entity State PDUs carry NO sustainment data.
      # Do not map thermal/fuel/power fields from DIS input — they are
      # legitimately absent. The Protobuf schema makes them optional.
      # =========================================================================

      let src = this

      root.event_id = uuid_v4()
      root.schema_revision = 1

      # Asset identity — URN from DIS is canonical until identity resolver overwrites it
      root.asset.asset_id   = $src.entity_id_urn
      root.asset.callsign   = $src.marking.or("")
      root.asset.force = match $src.force_id {
        1 => "FORCE_FRIENDLY"
        2 => "FORCE_OPPOSING"
        3 => "FORCE_NEUTRAL"
        _ => "FORCE_UNKNOWN"
      }

      # Structured DIS entity ID (site/application/entity triplet)
      root.asset.dis_entity_id.site        = $src.dis_entity_id.site
      root.asset.dis_entity_id.application = $src.dis_entity_id.application
      root.asset.dis_entity_id.entity      = $src.dis_entity_id.entity

      # -------------------------------------------------------------------------
      # DIS EntityType 7-tuple → OpenDDIL Platform Ontology
      #
      # The sidecar (dis_ingestor.py) has already decoded the 7-tuple from the
      # binary PDU. Here we only format the lookup key and resolve it.
      # Falls back to _default if the triple is not in the ontology.
      #
      # ADR-0007: No math here.
      # ADR-0010: No protocol quirks leak past this line.
      # -------------------------------------------------------------------------
      let et = $src.dis_entity_type
      # Ontology keys use underscore delimiters (not dots) because Bloblang's
      # .get("a.b.c") treats dots as path separators and cannot reach a flat
      # key like "1.1.225.1.3.1.0".
      #
      # parse_json() represents integers as `json.Number` rather than Go int —
      # `%d` cannot format that and would emit literal "%!d(json.Number=1)"
      # garbage. The explicit .int64() coerces to a plain integer first.
      let triple = "%d_%d_%d_%d_%d_%d_%d".format(
        $et.kind.or(0).int64(),
        $et.domain.or(0).int64(),
        $et.country.or(0).int64(),
        $et.category.or(0).int64(),
        $et.subcategory.or(0).int64(),
        $et.specific.or(0).int64(),
        $et.extra.or(0).int64()
      )
      # `no_cache: true` makes edits to dis_entity_types.yaml take effect
      # immediately without restarting redpanda-connect (the file is mounted
      # read-only into the container — see docker-compose volumes).
      let ontology_doc = file(path: "/ontology/dis_entity_types.yaml", no_cache: true).parse_yaml()
      let ont = $ontology_doc.mappings.get($triple).or($ontology_doc.mappings._default)

      # NOTE: Only fields that exist on AssetIdentity in
      # openddil.telemetry.v1.EntityTelemetryEvent are populated here. The
      # ontology row also carries `platform_family`, `nomenclature` triple,
      # and `siso_ref`, but those have no destination in the current proto.
      # Surface them later by adding new fields with NEW numbers (see ADR
      # rule: never renumber).
      root.asset.platform_type            = $ont.nomenclature.or("")
      root.asset.platform_variant         = $ont.platform_variant
      root.asset.configuration_baseline   = $ont.default_baseline.or("")
      root.asset.cbm_schema               = $ont.cbm_schema.or("")
      root.asset.domain_authority         = $ont.domain_authority.or("")

      # Structured 7-tuple through to Silver for downstream CM matching
      root.asset.dis_entity_type.kind        = $et.kind.or(0)
      root.asset.dis_entity_type.domain      = $et.domain.or(0)
      root.asset.dis_entity_type.country     = $et.country.or(0)
      root.asset.dis_entity_type.category    = $et.category.or(0)
      root.asset.dis_entity_type.subcategory = $et.subcategory.or(0)
      root.asset.dis_entity_type.specific    = $et.specific.or(0)
      root.asset.dis_entity_type.extra       = $et.extra.or(0)

      # Position: DIS ECEF is metres. Per ADR-0013, each component is a
      # Quantity with the source unit tagged. No math here.
      root.kinematics.position.ecef.x.value = $src.location_ecef.x
      root.kinematics.position.ecef.x.unit  = "m"
      root.kinematics.position.ecef.y.value = $src.location_ecef.y
      root.kinematics.position.ecef.y.unit  = "m"
      root.kinematics.position.ecef.z.value = $src.location_ecef.z
      root.kinematics.position.ecef.z.unit  = "m"
      root.kinematics.position.valid_at     = $src.ingest_timestamp
      # PositionSource enum has no "DIS_BINARY" — DIS feeds are simulator
      # output, so SIMULATED is the closest valid value. Add a dedicated
      # POS_SRC_DIS_* constant in a future proto revision if we want to
      # distinguish DIS-sourced positions from other simulators.
      root.kinematics.position.quality.source = "POS_SRC_SIMULATED"

      # Velocity: DIS ECEF m/s. Vector3 has its own `unit` slot (ADR-0007
      # already-correct case); just label and pass through.
      root.kinematics.velocity.ecef.x    = $src.linear_velocity_ecef.x
      root.kinematics.velocity.ecef.y    = $src.linear_velocity_ecef.y
      root.kinematics.velocity.ecef.z    = $src.linear_velocity_ecef.z
      root.kinematics.velocity.ecef.unit = "m/s"

      # Attitude: DIS emits radians natively. Per ADR-0013 the schema now
      # carries the unit, so we tell the truth instead of mislabelling as
      # `*_deg`. Consumers convert via pint.
      root.kinematics.attitude.euler.yaw.value   = $src.orientation_euler.psi
      root.kinematics.attitude.euler.yaw.unit    = "rad"
      root.kinematics.attitude.euler.pitch.value = $src.orientation_euler.theta
      root.kinematics.attitude.euler.pitch.unit  = "rad"
      root.kinematics.attitude.euler.roll.value  = $src.orientation_euler.phi
      root.kinematics.attitude.euler.roll.unit   = "rad"
      root.kinematics.attitude.reference         = "ATT_REF_BODY_TO_ECEF"

      # SUSTAINMENT: intentionally absent for DIS-sourced events.
      # DIS Entity State PDUs contain no sustainment metrics.
      # root.sustainment is NOT mapped here — its absence is correct.

      root.provenance.producer_id     = "dis-ingestor-binary"
      root.provenance.source_protocol = "DIS/IEEE-1278.1-binary"
      root.provenance.source_sequence = $src.pdu_sequence.or(0)
      root.provenance.sample_time     = $src.ingest_timestamp
      root.provenance.ingest_time     = now()
      root.provenance.classification  = "U"

      # Origin-node provenance (ADR-0022 / ADR-0023, Phase 6a). Stamped at
      # sensor-ingest under "origin_node"; preserved through to the Silver
      # Provenance.edge_id / Provenance.region_id. Absent on HTTP-diagnostic
      # input (port 9999) — those messages fall back to the projector's
      # env-default attribution (rate-limited WARN logged there).
      root.provenance.edge_id   = $src.origin_node.edge_id.or("")
      root.provenance.region_id = $src.origin_node.region_id.or("")

      # =====================================================================
      # OPERATIONAL STATE FROM ENTITY APPEARANCE (ADR-0026 / ADR-0030)
      # =====================================================================
      # ADR-0026's adapter list specified this mapping on 2026-05-27
      # (`appearance.damage / firepower_kill -> health_state`). The sidecar
      # has published the bits ever since; this is Stage 2 finally reading
      # them. Until 2026-08-19 the absence was registered as "no DIS source
      # for the health axis" — the record diagnosing its own unbuilt design
      # as a missing feed.
      #
      # `$src.appearance` is ABSENT unless the source is DECLARED to populate
      # the field AND the field is non-zero. Both refusals happen in Stage 1;
      # here we only have to honour them, and honouring them means the whole
      # block is conditional. A `.or()` default anywhere below would undo the
      # gate and manufacture health out of silence — which is the defect this
      # mapping was blocked on for a day (ADR-0026 amendment, clauses 1-2).
      let ax = $src.appearance.or({})

      # --- health axis -----------------------------------------------------
      # DESTROYED -> FAILED, not "critical damage". The asset is not impaired,
      # it is gone; FAULT would understate it and NOMINAL is unreachable.
      #
      # NONE -> NOMINAL is the load-bearing line: the first place in this
      # system where NOMINAL is a POSITIVE assertion from a source that
      # actually said so, rather than a value reached by falling through
      # every other branch (clause 4).
      root.operational_state.health_state = match {
        $ax.damage.or("") == "DESTROYED" => "HEALTH_STATE_FAILED",
        $ax.damage.or("") == "MODERATE"  => "HEALTH_STATE_FAULT",
        $ax.damage.or("") == "SLIGHT"    => "HEALTH_STATE_DEGRADED",
        $ax.damage.or("") == "NONE"      => "HEALTH_STATE_NOMINAL",
        # Includes UNRECOGNISED_n — the producer said something we do not
        # understand, which is not a health claim and must not become one.
        _ => deleted()
      }

      # --- power axis ------------------------------------------------------
      root.operational_state.power_state = match {
        $ax.deactivated.or(false)   => "POWER_STATE_OFF",
        $ax.power_plant_on.or(null) == true  => "POWER_STATE_ON",
        $ax.power_plant_on.or(null) == false => "POWER_STATE_OFF",
        _ => deleted()
      }

      # --- kills as subsystem faults ---------------------------------------
      # Carried as active_fault_codes in the "SUBSYS:HEALTH" form fusion's
      # _eval_subsystems already parses — so this needs NO contract change and
      # no new evaluator. The vocabulary is fusion's own: INOPERATIVE maps to
      # NON_OPERATIONAL.
      #
      # INOPERATIVE rather than DEGRADED, deliberately: a DIS "kill" means the
      # capability is GONE, not impaired. A mobility kill is a platform that
      # cannot move, and calling that "degraded" would understate it in the
      # one direction that matters.
      #
      # Note firepower_kill is absent from the air domain's ontology block, so
      # `$ax.firepower_kill` is simply missing there and no code is emitted —
      # the domain distinction is carried by absence, not by a branch here.
      root.sustainment.health.active_fault_codes = [
        if $ax.mobility_kill.or(false) { "PROPULSION:INOPERATIVE" },
        if $ax.firepower_kill.or(false) { "WEAPONS:INOPERATIVE" },
      ].filter(v -> v != null)

      root.sustainment.health.weapons_fault = $ax.firepower_kill.or(false)
