# =============================================================================
# DIS EFFECTOR EVENT DIVERSION (ingress)
# =============================================================================
# Answers ONE question: does this record describe a weapon being fired or a
# munition detonating, rather than an entity's own state? A Fire or
# Detonation PDU (pdu_type "fire" / "detonation") is a transient event ABOUT
# a launch or an impact, not a platform's kinematics or health — it has no
# `dis_entity_type.kind` of its own to admit or refuse, and sim_dis_mapping
# has no branch that could shape it into an asset-telemetry event. So it is
# diverted here, in openddil-base-connect.yaml's top-of-pipeline switch,
# alongside the `event_report` case and AHEAD of dis_kind_gate and
# dis_force_gate: both gates judge Entity State fields that fire/detonation
# records do not carry, and neither should ever see one.
#
# WHY NOT dis_event_report'S SHAPE. dis_event_report's only sink is an
# HTTP POST, so it ends by deleting the record (`root = deleted()`) — it
# never needs to reach the output switch. This resource is the opposite: its
# only sink IS Kafka, on the edge broker, so the record must survive this
# resource (labels stamped, a meta flag set, every other field carried
# forward as-is) and flow all the way to `output.switch` in
# openddil-base-connect.yaml, which carries a case for it the same way it
# already carries one for raw-sensor-stream.
#
# EDGE PROVENANCE IS FORWARDED, NOT ORIGINATED. Entity State, Remove Entity,
# Fire and Detonation records all carry `provenance.edge_id`/`region_id`,
# stamped by sensor-ingest itself from its own OPENDDIL_EDGE_ID/
# OPENDDIL_REGION_ID at ingest time. This resource runs on Connect, which has
# no such identity of its own in every deployment topology — it only ever
# forwards the field sensor-ingest already stamped, the same way
# sim-dis-mapping.yaml forwards it for the other PDU types.
#
# MALFORMED GOES TO THE SAME DLQ, THE SAME WAY. A record missing `event_urn`
# or `launcher_urn` cannot be keyed or tracked downstream. It is marked with
# `meta dlq_reason` / `meta dlq_stage` / `meta is_dlq = "true"` — the exact
# meta fields the catch block sets for a schema/protobuf failure — and left
# to fall through to `output.switch`'s existing `is_dlq` case. No new DLQ
# route is introduced.
#
# THE DROP IS A NUMBER, NOT SILENCE, same convention as dis_kind_gate and
# dis_force_gate. Every record this resource routes to effector-events
# increments `dis_effector_routed{pdu_type="fire"|"detonation"}` on the
# Connect metrics endpoint (:4196/metrics). Read it directly (the Connect
# image has no wget/curl, so go through the API server's proxy instead):
#
#   kubectl get --raw "/api/v1/namespaces/<ns>/pods/<connect-pod>:4196/proxy/metrics" | grep dis_effector_routed
# =============================================================================
processor_resources:
  - label: dis_effector
    switch:
      # Malformed arm: cannot be keyed or tracked without both ids. Same
      # meta fields the catch block uses, so output.switch's existing
      # `is_dlq` case carries it to ingress-dlq without a new output case.
      - check: 'this.event_urn.or("") == "" || this.launcher_urn.or("") == ""'
        processors:
          - log:
              level: WARN
              message: 'dis_effector malformed record, missing event_urn or launcher_urn: ${! content() }'
          - mapping: |
              meta dlq_reason = "effector record missing event_urn or launcher_urn"
              meta dlq_stage = "dis_effector"
              meta is_dlq = "true"

      # Well-formed arm: every other field passes unchanged
      # (provenance.edge_id is already on it, stamped by sensor-ingest); the
      # releasability labels are stamped here, then the record is flagged for
      # output.switch's effector-events case.
      - check: ""
        processors:
          - metric:
              type: counter
              name: dis_effector_routed
              labels:
                pdu_type: '${! this.pdu_type }'
          - mapping: |
              # ===================================================================
              # RELEASABILITY LABELS (ADR-0029 §3) — labelled exactly as the
              # launcher's own Entity State is.
              # ===================================================================
              # A launch has no originator_nation/releasable_to of its own; the
              # launcher that fired it does. There is one declaration of who an
              # asset belongs to (/ontology/releasability.yaml), read at the one
              # place labels are stamped — sim-dis-mapping.yaml, for Entity State.
              # This is that same lookup, keyed by launcher_urn instead of the
              # record's own entity_id_urn, because the record being labelled is
              # the launch, not the launcher. It must stay identical to
              # sim-dis-mapping.yaml's copy: same no_cache read, same
              # default_originator_nation fallback, same absent-stays-absent via
              # `.or(deleted())`. A launch and its launcher's Entity State are
              # the same row, so they get the same default and the same silence.
              let rel_doc = file(path: "/ontology/releasability.yaml", no_cache: true).parse_yaml()
              let rel_default = if $rel_doc.default_originator_nation != null {
                {"originator_nation": $rel_doc.default_originator_nation,
                 "releasable_to": []}
              } else { {} }
              let rel = $rel_doc.assets.get(this.launcher_urn).or($rel_default)

              # `root = this` first: every other field (event_urn, launcher_urn,
              # provenance.edge_id/region_id, ...) must carry forward as-is, and
              # only the two assignments below are meant to change anything.
              root = this
              root.provenance.originator_nation = $rel.originator_nation.or(deleted())
              root.provenance.releasable_to     = $rel.releasable_to.or(deleted())

              meta is_effector = "true"

# NOTE ON SCRAPING: same gap as dis_kind_gate and dis_force_gate. Nothing
# currently scrapes port 4196 (no ServiceMonitor, no prometheus.io/scrape
# annotation). Read the counter directly until that exists.
