name: Docker Build and Publish

on:
  push:
    branches: [ "master" ]
    # Version tags don't build here. A release adds the version tag to an
    # image already built (see release.yml) and never moves :latest.
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# All images publish under ghcr.io/edgy-solutions/openddil/<service>.
#
# Tags, on every image:
#   :sha-<7>  every build, from the commit it built. On a pull request that is
#             the branch head, not GitHub's merge commit, so the tag names a
#             commit that exists on the branch.
#   :pr-<N>   a pull request build.
#   :<tag>    not built here: a release adds it (release.yml).
#   :latest   a push or a dispatch on master, and nothing else. A branch, a
#             pull request or a tag never moves it.
# A pull request from a fork builds but pushes nothing: its token cannot write
# packages.
#
# `${{ github.repository_owner }}` resolves to `edgy-solutions` for this repo.
# These images are referenced by docker-compose.yml in this same repo.

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/frontend
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          target: production

  build-simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/simulator
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build and push simulator
        uses: docker/build-push-action@v4
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          target: production

  # The TAK server image: taky==0.10, same version and same config file as
  # docker-compose.yml's compose-only tak-server service, baked in instead of
  # `pip install`-ed at container start so a pod needs no PyPI reach at start.
  # No `paths:` filter exists on this workflow (see the `on:` block above —
  # it triggers on every push/PR to master, repo-wide), so
  # `egress/tak/**` already triggers this job; nothing to add there.
  build-tak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/tak-server
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build and push tak-server
        uses: docker/build-push-action@v4
        with:
          context: ./egress/tak
          file: ./egress/tak/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}

  # The egress gate and its pane: one image, two commands (see the header of
  # egress/Dockerfile). It differs from the two jobs above in one way, and the
  # difference is forced: the build context is the WORKSPACE ROOT, not a
  # directory of this repo, because the generated protos it bakes in come from
  # openddil-contracts. So both repos are checked out as siblings and codegen
  # runs first -- the same layout openddil-helm's build-bundle.yml uses.
  #
  # THE TEST STAGE RUNS HERE, and nothing in this job has to ask for it. The
  # runtime stage copies a file the test stage writes only when pytest exits
  # 0, so buildx cannot build `runtime` without running the tests, and a
  # failing test fails this step before anything is pushed. `target: runtime`
  # is named so that stays true if a stage is ever added after it.
  build-egress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openddil-demo (self)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: openddil-demo

      # No workflow in this repo runs policy/ or gateway/ tests as a CI step
      # (gateway has no build job of its own, and policy/ ships no image);
      # this job is the closest in purpose because it is the only one that
      # runs any Python tests at all (the egress test stage below). The
      # entitlements corpus and its version log are read by both egress's
      # and gateway's PDP calls, so a stale version here is exactly the kind
      # of drift this build should catch before it ships.
      - name: Check entitlements corpus version discipline
        run: |
          python3 openddil-demo/policy/check_corpus_version.py \
            openddil-demo/policy/users.yaml openddil-demo/policy/users.versions
          python3 openddil-demo/policy/check_corpus_version.py \
            openddil-demo/policy/users-promoted.yaml openddil-demo/policy/users-promoted.versions

      - name: Checkout openddil-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-contracts
          path: openddil-contracts

      # gen/ is gitignored in openddil-contracts. Without this the proto COPY
      # fails with "path not found in build context" -- which is the intended
      # failure, better than an image that ships without its stubs.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Python proto bindings in openddil-contracts
        run: |
          make -C openddil-contracts python

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/egress
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build, test and push egress
        uses: docker/build-push-action@v5
        with:
          context: .
          file: openddil-demo/egress/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          target: runtime
