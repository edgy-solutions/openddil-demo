name: Docker Build and Publish

on:
  push:
    branches: [ "master" ]
    # Tag pushes (v1.0.0, ...) publish versioned images
    # (:v1.0.0) alongside :latest so consumers can pin to a release.
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# All images publish under ghcr.io/edgy-solutions/openddil/<service>:latest
# AND additionally under :<tag-name> on a v* tag push.
# `${{ github.repository_owner }}` resolves to `edgy-solutions` for this repo.
# These images are referenced by docker-compose.yml in this same repo.

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always publish :latest. On a v* tag push, ALSO publish the
      # tag-versioned image so consumers can pin to a release.
      - name: Compute image tags
        id: tags
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/frontend
          T="$REG:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            T="$T,$REG:${{ github.ref_name }}"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          target: production

  build-simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/simulator
          T="$REG:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            T="$T,$REG:${{ github.ref_name }}"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build and push simulator
        uses: docker/build-push-action@v4
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          target: production

  # The egress gate and its pane: one image, two commands (see the header of
  # egress/Dockerfile). It differs from the two jobs above in one way, and the
  # difference is forced: the build context is the WORKSPACE ROOT, not a
  # directory of this repo, because the generated protos it bakes in come from
  # openddil-contracts. So both repos are checked out as siblings and codegen
  # runs first -- the same layout openddil-helm's build-bundle.yml uses.
  #
  # THE TEST STAGE RUNS HERE, and nothing in this job has to ask for it. The
  # runtime stage copies a file the test stage writes only when pytest exits
  # 0, so buildx cannot build `runtime` without running the tests, and a
  # failing test fails this step before anything is pushed. `target: runtime`
  # is named so that stays true if a stage is ever added after it.
  build-egress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openddil-demo (self)
        uses: actions/checkout@v4
        with:
          path: openddil-demo

      - name: Checkout openddil-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openddil-contracts
          path: openddil-contracts

      # gen/ is gitignored in openddil-contracts. Without this the proto COPY
      # fails with "path not found in build context" -- which is the intended
      # failure, better than an image that ships without its stubs.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Python proto bindings in openddil-contracts
        run: |
          make -C openddil-contracts python

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/egress
          T="$REG:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            T="$T,$REG:${{ github.ref_name }}"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build, test and push egress
        uses: docker/build-push-action@v5
        with:
          context: .
          file: openddil-demo/egress/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          target: runtime
