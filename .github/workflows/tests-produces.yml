name: Tests (produces manifest)

# produces.yaml must equal what the shipped producers can write (the egress image's three roles and the three
# Connect pipelines the chart mounts), so a new send site, topic or output case fails here in the PR that adds it.
on:
  push:
    branches: [ "master" ]
    paths:
      - "egress/**"
      - "openddil-base-connect.yaml"
      - "cm-intake.yaml"
      - "declaration-intake.yaml"
      - "produces.yaml"
      - "produces_manifest.py"
      - "tests/test_produces_manifest.py"
      - ".github/workflows/tests-produces.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "egress/**"
      - "openddil-base-connect.yaml"
      - "cm-intake.yaml"
      - "declaration-intake.yaml"
      - "produces.yaml"
      - "produces_manifest.py"
      - "tests/test_produces_manifest.py"
      - ".github/workflows/tests-produces.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The test imports produces_manifest (pyyaml) and the egress modules' config loaders (kinds.py imports
      # jsonschema); not the confluent/asyncpg/protobuf stack, which the loaders never touch.
      - name: Install
        run: pip install pytest "pyyaml>=6.0" "jsonschema>=4.18,<5"
      - name: produces manifest equals the code
        run: python -m pytest -q tests/test_produces_manifest.py
