version: '3.8'

services:
  redpanda-edge:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge:9092,OUTSIDE://localhost:9093
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9644:9644"

  redpanda-hq:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '1'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092,OUTSIDE://0.0.0.0:19093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-hq:19092,OUTSIDE://localhost:19093
    ports:
      - "19092:19092"
      - "19093:19093"
      - "19644:19644"

  postgres-hq:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openddil
    ports:
      - "5432:5432"

  electric-sync:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres-hq:5432/openddil
      LOGICAL_PUBLISHER_HOST: electric-sync
      AUTH_JWT_ALG: HS256
      AUTH_JWT_KEY: "secret"
    ports:
      - "5133:5133"
    depends_on:
      - postgres-hq

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474" # Proxy port
      - "8475:8475" # API port
    command: -host 0.0.0.0

  redpanda-connect:
    image: docker.redpanda.com/redpandadata/connect:latest
    volumes:
      - ./redpanda-connect.yaml:/benthos.yaml
    command: run /benthos.yaml
    depends_on:
      - redpanda-edge
      - toxiproxy

  simulator:
    image: ghcr.io/edgy-solutions/openddil-demo-simulator:latest
    container_name: openddil-demo-simulator
    environment:
      KAFKA_BROKER: "redpanda-edge:9092"
    ports:
      - "8000:8000"
    depends_on:
      - redpanda-edge

  faust-edge:
    image: ghcr.io/edgy-solutions/edge-faust-detector:latest
    container_name: openddil-demo-faust
    entrypoint: ["/opt/venv/bin/python", "/app/faust_edge.py", "worker", "-l", "info"]
    volumes:
      - ../openddil-tactical-agents/edge/faust_edge.py:/app/faust_edge.py
    depends_on:
      - redpanda-edge

  restate-server:
    image: restatedev/restate:1.1.2
    container_name: openddil-demo-restate-server
    ports:
      - "8080:8080"
      - "9070:9070"

  restate-hub:
    image: ghcr.io/edgy-solutions/hub-restate-projector:latest
    container_name: openddil-demo-restate-hub
    entrypoint: ["/opt/venv/bin/python", "/app/restate_hub.py"]
    environment:
      DB_PATH: "/tmp/edge_state.db"
    volumes:
      - ../openddil-tactical-agents/hub/restate_hub.py:/app/restate_hub.py
    depends_on:
      - restate-server

  frontend:
    image: ghcr.io/edgy-solutions/openddil-demo-frontend:latest
    container_name: openddil-demo-frontend
    ports:
      - "5173:80"
