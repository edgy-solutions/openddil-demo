version: '3.8'

# =============================================================================
# OpenDDIL Demo — base compose (REGISTRY IMAGES ONLY)
# =============================================================================
# RULE: This file must contain ONLY `image:` references (pulled from
# ghcr.io / docker.io / etc.). It MUST NOT contain `build:` directives.
# Local builds, hot-reload source mounts, and other developer affordances
# live in docker-compose.override.yml, which `docker compose` auto-merges
# on top of this file when present.
#
# Rationale:
#   - The base compose models a deployable state — a customer or CI runner
#     should be able to `docker compose -f docker-compose.yml up` and get
#     a working system pulled from a registry without any source repos
#     present on disk.
#   - The override compose models a developer state — sibling repos
#     cloned next to openddil-demo, source bind-mounted into containers
#     for hot reload, image built locally rather than pulled.
#
# When adding a new service:
#   1. Push the image to ghcr.io/edgy-solutions/openddil/<service>:latest
#   2. Add the `image:` reference here.
#   3. Add the matching `build:` block (+ any dev mounts) in
#      docker-compose.override.yml.
#
# See AGENTS.md / llms.txt / .cursorrules in this repo for the rule.
# =============================================================================

services:
  redpanda-edge:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge:9092,OUTSIDE://localhost:9093
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-hq:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '1'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092,OUTSIDE://0.0.0.0:19093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-hq:19092,OUTSIDE://localhost:19093
    ports:
      - "19092:19092"
      - "19093:19093"
      - "19644:19644"

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    depends_on:
      redpanda-edge:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        rpk -X brokers=redpanda-edge:9092 topic create raw-sensor-stream \
            -p 8 -r 1 \
            -c retention.ms=86400000 \
            || true
        rpk -X brokers=redpanda-edge:9092 topic create ingress-dlq \
            -p 1 -r 1 \
            -c retention.ms=604800000 \
            || true
        rpk -X brokers=redpanda-edge:9092 topic create telemetry-latest-state \
            -p 8 -r 1 \
            -c cleanup.policy=compact \
            -c min.cleanable.dirty.ratio=0.1 \
            -c segment.ms=60000 \
            || true
        rpk -X brokers=redpanda-edge:9092 topic create tactical-events \
            -p 4 -r 1 \
            -c retention.ms=2592000000 \
            || true
        echo "INFO: Core topics initialized."

        # CM state topics (compacted — latest state per key, retained forever)
        rpk -X brokers=redpanda-edge:9092 topic create asset-cm-state \
            -p 8 -r 1 \
            -c cleanup.policy=compact \
            -c min.cleanable.dirty.ratio=0.1 \
            -c segment.ms=60000 \
            -c retention.ms=-1 \
            || true
        echo "INFO: asset-cm-state created or already exists."

        rpk -X brokers=redpanda-edge:9092 topic create cm-items \
            -p 8 -r 1 \
            -c cleanup.policy=compact \
            -c min.cleanable.dirty.ratio=0.1 \
            -c segment.ms=60000 \
            -c retention.ms=-1 \
            || true
        echo "INFO: cm-items created or already exists."

        # CM events (hybrid compact+delete — recent events + compacted state)
        rpk -X brokers=redpanda-edge:9092 topic create cm-events \
            -p 8 -r 1 \
            -c cleanup.policy=compact,delete \
            -c retention.ms=2592000000 \
            || true
        echo "INFO: cm-events created or already exists."

        # Bronze ingest topics (per ADR-0010 — one topic per protocol)
        rpk -X brokers=redpanda-edge:9092 topic create ingress-dis-raw \
            -p 8 -r 1 \
            -c retention.ms=86400000 \
            -c compression.type=zstd \
            || true
        echo "INFO: ingress-dis-raw created or already exists."

        rpk -X brokers=redpanda-edge:9092 topic create ingress-proprietary-raw \
            -p 8 -r 1 \
            -c retention.ms=86400000 \
            -c compression.type=zstd \
            || true
        echo "INFO: ingress-proprietary-raw created or already exists."

        # Phase 3.5: System A proprietary battle simulator
        rpk -X brokers=redpanda-edge:9092 topic create ingress-sim-a-raw \
            -p 8 -r 1 \
            -c retention.ms=86400000 \
            -c compression.type=zstd \
            || true
        echo "INFO: ingress-sim-a-raw created or already exists."

        # Phase 3.5: rolling-window aggregations from the Faust windowing agent
        rpk -X brokers=redpanda-edge:9092 topic create asset-telemetry-windows \
            -p 8 -r 1 \
            -c retention.ms=86400000 \
            -c cleanup.policy=delete \
            || true
        echo "INFO: asset-telemetry-windows created or already exists."

        # Phase 3.5: per-asset fused logistics status (compacted, retained forever)
        rpk -X brokers=redpanda-edge:9092 topic create asset-logistics-status \
            -p 8 -r 1 \
            -c cleanup.policy=compact \
            -c min.cleanable.dirty.ratio=0.1 \
            -c segment.ms=60000 \
            -c retention.ms=-1 \
            || true
        echo "INFO: asset-logistics-status created or already exists."

        echo "INFO: All topics initialized."

  postgres-hq:
    image: postgres:15
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openddil
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openddil"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply the canonical Atlas schema to postgres-hq, then create
  # the ElectricSQL publication. Runs after postgres-hq is healthy; exits 0
  # on success. Without this, postgres-hq comes up with zero tables and
  # every downstream consumer (Electric, projector, UI shapes) silently
  # fails. The schema lives in openddil-stack/ (single canonical location);
  # `migrations/` is committed alongside it.
  atlas-init:
    image: arigaio/atlas:latest
    container_name: openddil-demo-atlas-init
    depends_on:
      postgres-hq:
        condition: service_healthy
    volumes:
      - ../openddil-stack/schema:/schema:ro
    # The arigaio/atlas image has no shell — `atlas` is the entrypoint, so
    # `command:` carries only the subcommand args. Matches the atlas-init
    # block in openddil-stack/docker-compose.yml.
    command:
      - "migrate"
      - "apply"
      - "--dir"
      - "file:///schema/migrations"
      - "--url"
      - "postgres://postgres:password@postgres-hq:5432/openddil?sslmode=disable"
    restart: "no"

  # Postgres-side ElectricSQL setup: creates the publication that the
  # electric-sync service reads. Runs after atlas-init has created the
  # tables. Separate from atlas-init because Atlas owns DDL; this owns
  # publications/replication-role grants.
  electric-publish-init:
    image: postgres:15
    container_name: openddil-demo-electric-publish-init
    depends_on:
      atlas-init:
        condition: service_completed_successfully
    volumes:
      - ../openddil-stack/electric:/electric:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[electric-publish-init] applying publication..."
        PGPASSWORD=password psql -v ON_ERROR_STOP=1 \
          -h postgres-hq -U postgres -d openddil \
          -f /electric/electrify.sql
        echo "[electric-publish-init] publication ready"
    restart: "no"

  electric-sync:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres-hq:5432/openddil
      LOGICAL_PUBLISHER_HOST: electric-sync
      AUTH_JWT_ALG: HS256
      AUTH_JWT_KEY: "secret"
      ELECTRIC_INSECURE: "true"
      # ElectricSQL defaults to binding port 3000 inside the container. The
      # host port mapping below assumes it listens on 5133 — set the bind
      # port explicitly so the two agree. The env var is ELECTRIC_PORT (not
      # PORT — confirmed against the image's own healthcheck,
      # `curl http://localhost:${ELECTRIC_PORT-3000}/v1/health`). Phase 4a
      # fix; previously the 5133->5133 mapping pointed at nothing and every
      # shape request died as "Empty reply from server."
      ELECTRIC_PORT: "5133"
    ports:
      - "5133:5133"
    depends_on:
      postgres-hq:
        condition: service_healthy
      electric-publish-init:
        condition: service_completed_successfully

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474" # Proxy port
      - "8475:8475" # API port
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json
    command: -host 0.0.0.0 -port 8475

  # NOTE: RabbitMQ, the System A AMQP-ingress Connect container, the System B
  # AMQP-egress Connect container, and the proprietary-ingest sidecar are
  # CUSTOMER-ENCUMBERED service blocks. They live in the customer overlay
  # at openddil-customer-bundle/docker-compose.customer.yml — NOT in this
  # public file. To run the full demo with customer feeds, layer the overlay:
  #
  #   docker compose \
  #     -f openddil-demo/docker-compose.yml \
  #     -f openddil-customer-bundle/docker-compose.customer.yml \
  #     up

  openddil-sensor-ingest:
    image: ghcr.io/edgy-solutions/openddil/sensor-ingest:latest
    pull_policy: always
    command: python dis_ingestor.py
    ports:
      - "62040:62040/udp"
      - "8081:8080" # Prometheus metrics (mapped to 8081 to avoid conflict with Restate)
    environment:
      KAFKA_BROKERS: redpanda-edge:9092
      KAFKA_TOPIC: ingress-dis-raw
      LOG_LEVEL: INFO
    depends_on:
      redpanda-edge:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Customer-feed sidecars (openddil-proprietary-ingest, the System A AMQP
  # Connect, and the System B AMQP egress Connect) live in the customer
  # overlay — see the note near the toxiproxy block above.

  redpanda-connect:
    container_name: openddil-demo-redpanda-connect-1
    image: docker.redpanda.com/redpandadata/connect:latest
    ports:
      - "9999:9999"
    volumes:
      - ./openddil-base-connect.yaml:/connect.yaml
      - ./dynamic-mappings:/mappings
      - ../openddil-contracts/proto:/proto
      - ../openddil-contracts/ontology:/ontology:ro
    command: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
    depends_on:
      - redpanda-edge
      - toxiproxy

  simulator:
    image: ghcr.io/edgy-solutions/openddil/simulator:latest
    profiles:
      - "disabled"
    pull_policy: always
    container_name: openddil-demo-simulator
    environment:
      KAFKA_BROKER: "redpanda-edge:9092"
    # Ports 8000 removed to avoid corporate machine conflicts; now proxied via Nginx
    # ports:
    #   - "8000:8000"
    depends_on:
      - redpanda-edge

  faust-edge:
    image: ghcr.io/edgy-solutions/openddil/faust-edge:latest
    restart: always
    container_name: openddil-demo-faust
    working_dir: /tmp
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redpanda-edge

  restate-server:
    # Bumped 2026-05-13 from 1.1.2 to 1.6.2 — restate-sdk-python 0.17.1
    # speaks a newer discovery protocol than 1.1.x supports (the older server
    # rejected handler registration with HTTP 415).
    image: restatedev/restate:1.6.2
    container_name: openddil-demo-restate-server
    command: ["-c", "/config/restate-config.toml"]
    volumes:
      - ./restate-config.toml:/config/restate-config.toml:ro
    ports:
      - "8080:8080"
      - "9070:9070"

  restate-hub:
    image: ghcr.io/edgy-solutions/openddil/hub-restate-projector:latest
    pull_policy: always
    container_name: openddil-demo-restate-hub
    entrypoint: ["/opt/venv/bin/python", "/app/restate_hub.py"]
    environment:
      DB_PATH: "/tmp/edge_state.db"
    volumes:
      - ../openddil-tactical-agents/hub/restate_hub.py:/app/restate_hub.py
    depends_on:
      - restate-server

  # ===========================================================================
  # Configuration Management Service (Phase 3, ADR-0014)
  # ===========================================================================
  # Restate Virtual Object "AssetCM" — one durable instance per asset_id.
  # Owns As-Maintained state, discrepancy analysis, and lifecycle transitions.
  # ASGI endpoint on :9080; Restate discovers handlers from there.
  # Kafka publisher (egress) targets redpanda-edge:9092 for asset-cm-state
  # and tactical-events; Kafka ingress is wired by cm-service-bootstrap.
  cm-service:
    image: ghcr.io/edgy-solutions/openddil/cm-service:latest
    pull_policy: always
    container_name: openddil-demo-cm-service
    environment:
      CM_BASELINES_DIR:       /baselines
      CM_KAFKA_BROKERS:       redpanda-edge:9092
      CM_HTTP_PORT:           "9080"
      CM_STALENESS_WINDOW_S:  "900"
      LOG_LEVEL:              INFO
      PYTHONPATH:             /proto:/app/src
    volumes:
      # Cross-repo reference data mounted from the contracts source repo —
      # OSS contributors maintaining the contracts repo see updates without
      # rebuilding the cm-service image. Production deployments may
      # alternatively bake these into the image.
      - ../openddil-contracts/gen/python:/proto:ro
      - ../openddil-contracts/baselines:/baselines:ro
    ports:
      - "9080:9080"
    depends_on:
      redpanda-edge:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: registers cm-service with Restate and creates the Kafka
  # subscriptions for raw-sensor-stream and cm-events. Idempotent — safe
  # to re-run.
  # =============================================================================
  # Logistics Fusion Service (Phase 3.5, ADR-0014)
  # =============================================================================
  # Restate Virtual Object "AssetLogistics" — one durable instance per
  # asset_id. Consumes windowed telemetry + cm-state + Silver telemetry,
  # computes overall logistics severity via pure-Python rules, emits
  # AssetLogisticsStatusUpdate to asset-logistics-status. Kafka subscriptions
  # registered by logistics-fusion-bootstrap (below).
  logistics-fusion-service:
    image: ghcr.io/edgy-solutions/openddil/logistics-fusion-service:latest
    pull_policy: always
    container_name: openddil-demo-logistics-fusion-service
    environment:
      FUSION_KAFKA_BROKERS:    redpanda-edge:9092
      FUSION_HTTP_PORT:        "9081"
      EMIT_INTERVAL_SECONDS:   "30"
      STALE_INPUT_SECONDS:     "300"
      ONTOLOGY_DIR:            /ontology
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
      - ../openddil-contracts/ontology:/ontology:ro
    ports:
      - "9081:9081"
    depends_on:
      redpanda-edge:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: registers logistics-fusion-service with Restate and creates the
  # Kafka subscriptions for asset-telemetry-windows, asset-cm-state, and
  # raw-sensor-stream. Idempotent (uses shared bootstrap library's dedup).
  logistics-fusion-bootstrap:
    # Reuses the same image as logistics-fusion-service; only the entrypoint
    # differs (the bootstrap wrapper script).
    image: ghcr.io/edgy-solutions/openddil/logistics-fusion-service:latest
    pull_policy: always
    container_name: openddil-demo-logistics-fusion-bootstrap
    entrypoint: ["python", "/app/bootstrap/register_subscriptions.py"]
    environment:
      RESTATE_ADMIN_URL:        http://restate-server:9070
      FUSION_SERVICE_ENDPOINT:  http://logistics-fusion-service:9081
      KAFKA_CLUSTER_NAME:       openddil-edge
      KAFKA_BROKERS:            redpanda-edge:9092
      LOG_LEVEL:                INFO
      PYTHONPATH:               /app
    volumes:
      # Shared bootstrap library — cross-repo Python module, mounted rather
      # than baked so updates to openddil-contracts/bootstrap propagate
      # without rebuilding every service image.
      - ../openddil-contracts/bootstrap:/app/openddil_bootstrap:ro
    depends_on:
      logistics-fusion-service:
        condition: service_started
      restate-server:
        condition: service_started
    restart: "no"

  cm-service-bootstrap:
    # Reuses the same image as cm-service; only the entrypoint differs.
    image: ghcr.io/edgy-solutions/openddil/cm-service:latest
    pull_policy: always
    container_name: openddil-demo-cm-service-bootstrap
    entrypoint: ["python", "/app/bootstrap/register_subscriptions.py"]
    environment:
      RESTATE_ADMIN_URL:    http://restate-server:9070
      CM_SERVICE_ENDPOINT:  http://cm-service:9080
      KAFKA_CLUSTER_NAME:   openddil-edge
      KAFKA_BROKERS:        redpanda-edge:9092
      LOG_LEVEL:            INFO
      # The bootstrap wrapper does
      #   from openddil_bootstrap.restate_subscriptions import ...
      # which resolves via the shared library mount below.
      PYTHONPATH:           /app
    volumes:
      # Shared bootstrap library — cross-repo Python module, mounted rather
      # than baked so updates to openddil-contracts/bootstrap propagate
      # without rebuilding every service image.
      - ../openddil-contracts/bootstrap:/app/openddil_bootstrap:ro
    depends_on:
      cm-service:
        condition: service_started
      restate-server:
        condition: service_started
    restart: "no"

  # =============================================================================
  # Projector (Phase 4a, ADR-0016)
  # =============================================================================
  # Single generic Kafka -> Postgres projector. Consumes the per-asset
  # pipeline topics (asset-cm-state, asset-logistics-status,
  # telemetry-latest-state, tactical-events, asset-telemetry-windows) and
  # UPSERTs them into the Postgres read-model tables that ElectricSQL
  # exposes as Shapes to the UI. One service, many subscriptions.
  #
  # Depends on atlas-init: the read-model tables must exist before the
  # projector can write them.
  openddil-projector:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector
    environment:
      KAFKA_BROKERS:       redpanda-edge:9092
      POSTGRES_DSN:        postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:        "8084"
      RATE_LIMIT_PER_SEC:  "10"
      LOG_LEVEL:           INFO
      PYTHONPATH:          /proto:/app/src
    volumes:
      # Generated proto stubs — mounted from the contracts repo, same
      # pattern as cm-service and logistics-fusion-service.
      - ../openddil-contracts/gen/python:/proto:ro
    ports:
      - "8084:8084"   # Prometheus metrics
    depends_on:
      redpanda-edge:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: ghcr.io/edgy-solutions/openddil/frontend:latest
    pull_policy: always
    container_name: openddil-demo-frontend
    ports:
      - "3017:80"
