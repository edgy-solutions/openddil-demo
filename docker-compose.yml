version: '3.8'

# =============================================================================
# OpenDDIL Demo — base compose (REGISTRY IMAGES ONLY)
# =============================================================================
# RULE: This file must contain ONLY `image:` references (pulled from
# ghcr.io / docker.io / etc.). It MUST NOT contain `build:` directives.
# Local builds, hot-reload source mounts, and other developer affordances
# live in docker-compose.override.yml, which `docker compose` auto-merges
# on top of this file when present.
#
# Rationale:
#   - The base compose models a deployable state — a customer or CI runner
#     should be able to `docker compose -f docker-compose.yml up` and get
#     a working system pulled from a registry without any source repos
#     present on disk.
#   - The override compose models a developer state — sibling repos
#     cloned next to openddil-demo, source bind-mounted into containers
#     for hot reload, image built locally rather than pulled.
#
# When adding a new service:
#   1. Push the image to ghcr.io/edgy-solutions/openddil/<service>:latest
#   2. Add the `image:` reference here.
#   3. Add the matching `build:` block (+ any dev mounts) in
#      docker-compose.override.yml.
#
# See AGENTS.md / llms.txt / .cursorrules in this repo for the rule.
# =============================================================================

services:
  # =========================================================================
  # Edge tier — 3 brokers, one per edge (ADR-0023 Phase 6a).
  # region-east carries edge-01 + edge-02; region-west carries edge-03.
  # Each broker is its own Kafka cluster; cross-edge data movement happens
  # only via the per-edge bridges to redpanda-hq.
  # =========================================================================
  redpanda-edge-01:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge-01:9092,OUTSIDE://localhost:9093
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-edge-02:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '2'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge-02:9092,OUTSIDE://localhost:9095
    ports:
      - "9094:9092"
      - "9095:9093"
      - "9645:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-edge-03:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '3'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge-03:9092,OUTSIDE://localhost:9097
    ports:
      - "9096:9092"
      - "9097:9093"
      - "9646:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-hq:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '1'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092,OUTSIDE://0.0.0.0:19093
      # The PLAINTEXT listener ADVERTISES the toxiproxy address, not its
      # own (Phase 4c.5). The edge-hq-bridge bootstraps via toxiproxy:8474,
      # and a Kafka client then connects directly to whatever address the
      # broker advertises — so for toxiproxy to actually mediate produce
      # traffic (and for the DDIL sever to be real), the broker must
      # advertise toxiproxy:8474. The bridge is redpanda-hq's only client.
      - --advertise-kafka-addr
      - PLAINTEXT://toxiproxy:8474,OUTSIDE://localhost:19093
    ports:
      - "19092:19092"
      - "19093:19093"
      - "19644:19644"

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-edge-02:
        condition: service_healthy
      redpanda-edge-03:
        condition: service_healthy
      redpanda-hq:
        condition: service_started
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        # ADR-0023 Phase 6a: each edge broker is its own Kafka cluster; the
        # same topic shapes are created on each so per-edge produce/consume
        # works identically across the 3 edges.
        for B in redpanda-edge-01:9092 redpanda-edge-02:9092 redpanda-edge-03:9092 redpanda-hq:19092; do
          echo "INFO: Initializing topics on $$B..."
          rpk -X brokers=$$B topic create raw-sensor-stream \
              -p 1 -r 1 \
              -c retention.ms=86400000 \
              || true
          rpk -X brokers=$$B topic create ingress-dlq \
              -p 1 -r 1 \
              -c retention.ms=604800000 \
              || true
          rpk -X brokers=$$B topic create telemetry-latest-state \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              || true
          rpk -X brokers=$$B topic create tactical-events \
              -p 4 -r 1 \
              -c retention.ms=2592000000 \
              || true
          rpk -X brokers=$$B topic create asset-cm-state \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create cm-items \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create cm-events \
              -p 8 -r 1 \
              -c cleanup.policy=compact,delete \
              -c retention.ms=2592000000 \
              || true
          rpk -X brokers=$$B topic create ingress-dis-raw \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c compression.type=zstd \
              || true
          rpk -X brokers=$$B topic create ingress-proprietary-raw \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c compression.type=zstd \
              || true
          rpk -X brokers=$$B topic create ingress-sim-a-raw \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c compression.type=zstd \
              || true
          rpk -X brokers=$$B topic create asset-telemetry-windows \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c cleanup.policy=delete \
              || true
          rpk -X brokers=$$B topic create asset-logistics-status \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create derived-sustainment \
              -p 1 -r 1 \
              -c retention.ms=86400000 \
              || true
          echo "INFO: Topics initialized on $$B."
        done
        echo "INFO: All topics initialized across all 3 edge brokers."

  postgres-hq:
    image: postgres:15
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openddil
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openddil"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply the canonical Atlas schema to postgres-hq, then create
  # the ElectricSQL publication. Runs after postgres-hq is healthy; exits 0
  # on success. Without this, postgres-hq comes up with zero tables and
  # every downstream consumer (Electric, projector, UI shapes) silently
  # fails. The schema lives in openddil-stack/ (single canonical location);
  # `migrations/` is committed alongside it.
  atlas-init:
    image: arigaio/atlas:latest
    container_name: openddil-demo-atlas-init
    depends_on:
      postgres-hq:
        condition: service_healthy
    volumes:
      - ../openddil-stack/schema:/schema:ro
    # The arigaio/atlas image has no shell — `atlas` is the entrypoint, so
    # `command:` carries only the subcommand args. Matches the atlas-init
    # block in openddil-stack/docker-compose.yml.
    command:
      - "migrate"
      - "apply"
      - "--dir"
      - "file:///schema/migrations"
      - "--url"
      - "postgres://postgres:password@postgres-hq:5432/openddil?sslmode=disable"
    restart: "no"

  # Postgres-side ElectricSQL setup: creates the publication that the
  # electric-sync service reads. Runs after atlas-init has created the
  # tables. Separate from atlas-init because Atlas owns DDL; this owns
  # publications/replication-role grants.
  electric-publish-init:
    image: postgres:15
    container_name: openddil-demo-electric-publish-init
    depends_on:
      atlas-init:
        condition: service_completed_successfully
    volumes:
      - ../openddil-stack/electric:/electric:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[electric-publish-init] applying publication..."
        PGPASSWORD=password psql -v ON_ERROR_STOP=1 \
          -h postgres-hq -U postgres -d openddil \
          -f /electric/electrify.sql
        echo "[electric-publish-init] publication ready"
    restart: "no"

  electric-sync:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres-hq:5432/openddil
      LOGICAL_PUBLISHER_HOST: electric-sync
      AUTH_JWT_ALG: HS256
      AUTH_JWT_KEY: "secret"
      ELECTRIC_INSECURE: "true"
      # ElectricSQL defaults to binding port 3000 inside the container. The
      # host port mapping below assumes it listens on 5133 — set the bind
      # port explicitly so the two agree. The env var is ELECTRIC_PORT (not
      # PORT — confirmed against the image's own healthcheck,
      # `curl http://localhost:${ELECTRIC_PORT-3000}/v1/health`). Phase 4a
      # fix; previously the 5133->5133 mapping pointed at nothing and every
      # shape request died as "Empty reply from server."
      ELECTRIC_PORT: "5133"
    ports:
      - "5133:5133"
    depends_on:
      postgres-hq:
        condition: service_healthy
      electric-publish-init:
        condition: service_completed_successfully

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474" # Proxy port
      - "8475:8475" # API port
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json
    # `-config` was missing before Phase 4c.5 — toxiproxy.json was mounted
    # but never loaded, so the hq-link proxy did not exist at runtime and
    # the DDIL sever demo was a no-op. Loading the config registers
    # hq-link (edge -> redpanda-hq:19092) so the WAN sever is real.
    #
    # ADR-0023 Phase 6a: kept at ONE proxy (the existing hq-link on 8474)
    # rather than expanding to 3 per-edge proxies, because per-edge
    # severability at the bridge transport requires per-edge HQ broker
    # listeners (redpanda-hq advertises ONE address; with 3 proxies, all
    # bridges still end up routing follow-up traffic through whatever the
    # broker advertises — same convincing-fake failure mode ADR-0021 §The
    # runtime-verification lesson describes). 6a ships cluster-tier
    # severability ("sever the link, all bridges stop"); true per-edge
    # severability is 6c rewire alongside the UI multi-edge toggle work.
    command: -host 0.0.0.0 -port 8475 -config /etc/toxiproxy.json

  # =============================================================================
  # Edge -> HQ bridges (Phase 4c.5 / ADR-0023 Phase 6a)
  # =============================================================================
  # Three bridges, one per edge, each with its own consumer-group name so
  # per-edge bridge-group lag is readable in rpk. All three currently write
  # through the single toxiproxy hq-link proxy — true per-edge severability
  # at the bridge transport requires per-edge HQ broker listeners
  # (deferred to 6c rewire alongside the UI multi-edge toggle work). For
  # 6a the demonstrated severability is cluster-tier ("sever the link,
  # all 3 edges' bridges stop"); per-edge attribution on the read-model
  # side is verified via the EDGE ATTRIBUTION panel which reads
  # telemetry_latest_state.edge_id directly (independent path).
  edge-hq-bridge-01:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: openddil-demo-edge-hq-bridge-01
    volumes:
      - ./redpanda-connect-edge-01.yaml:/connect.yaml:ro
    command: ["--chilled", "run", "/connect.yaml"]
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      redpanda-hq:
        condition: service_started
    restart: unless-stopped

  edge-hq-bridge-02:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: openddil-demo-edge-hq-bridge-02
    volumes:
      - ./redpanda-connect-edge-02.yaml:/connect.yaml:ro
    command: ["--chilled", "run", "/connect.yaml"]
    depends_on:
      redpanda-edge-02:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      redpanda-hq:
        condition: service_started
    restart: unless-stopped

  edge-hq-bridge-03:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: openddil-demo-edge-hq-bridge-03
    volumes:
      - ./redpanda-connect-edge-03.yaml:/connect.yaml:ro
    command: ["--chilled", "run", "/connect.yaml"]
    depends_on:
      redpanda-edge-03:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      redpanda-hq:
        condition: service_started
    restart: unless-stopped

  # NOTE: RabbitMQ, the System A AMQP-ingress Connect container, the System B
  # AMQP-egress Connect container, and the proprietary-ingest sidecar are
  # CUSTOMER-ENCUMBERED service blocks. They live in the customer overlay
  # at openddil-customer-bundle/docker-compose.customer.yml — NOT in this
  # public file. To run the full demo with customer feeds, layer the overlay:
  #
  #   docker compose \
  #     -f openddil-demo/docker-compose.yml \
  #     -f openddil-customer-bundle/docker-compose.customer.yml \
  #     up

  # =============================================================================
  # Sensor-ingest — 3 instances, one per edge (ADR-0023 Phase 6a).
  # Each listens on a distinct host UDP port and stamps its OPENDDIL_EDGE_ID
  # into Bronze JSON (DIS-mapper Bloblang preserves through to Silver
  # Provenance.edge_id / region_id). Entity-range partitioning is
  # test-side discipline — sensor-ingest stays a pure UDP→Kafka transport.
  # =============================================================================
  openddil-sensor-ingest-01:
    image: ghcr.io/edgy-solutions/openddil/sensor-ingest:latest
    pull_policy: always
    container_name: openddil-demo-sensor-ingest-01
    command: python dis_ingestor.py
    ports:
      - "62040:62040/udp"
      - "8081:8080"
    environment:
      KAFKA_BROKERS:      redpanda-edge-01:9092
      KAFKA_TOPIC:        ingress-dis-raw
      OPENDDIL_EDGE_ID:   edge-01
      OPENDDIL_REGION_ID: region-east
      LOG_LEVEL:          INFO
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-sensor-ingest-02:
    image: ghcr.io/edgy-solutions/openddil/sensor-ingest:latest
    pull_policy: always
    container_name: openddil-demo-sensor-ingest-02
    command: python dis_ingestor.py
    ports:
      - "62041:62041/udp"
      - "8082:8080"
    environment:
      UDP_PORT:           "62041"
      KAFKA_BROKERS:      redpanda-edge-02:9092
      KAFKA_TOPIC:        ingress-dis-raw
      OPENDDIL_EDGE_ID:   edge-02
      OPENDDIL_REGION_ID: region-east
      LOG_LEVEL:          INFO
    depends_on:
      redpanda-edge-02:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-sensor-ingest-03:
    image: ghcr.io/edgy-solutions/openddil/sensor-ingest:latest
    pull_policy: always
    container_name: openddil-demo-sensor-ingest-03
    command: python dis_ingestor.py
    ports:
      - "62042:62042/udp"
      - "8083:8080"
    environment:
      UDP_PORT:           "62042"
      KAFKA_BROKERS:      redpanda-edge-03:9092
      KAFKA_TOPIC:        ingress-dis-raw
      OPENDDIL_EDGE_ID:   edge-03
      OPENDDIL_REGION_ID: region-west
      LOG_LEVEL:          INFO
    depends_on:
      redpanda-edge-03:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Customer-feed sidecars (openddil-proprietary-ingest, the System A AMQP
  # Connect, and the System B AMQP egress Connect) live in the customer
  # overlay — see the note near the toxiproxy block above.

  # =============================================================================
  # DIS-mapper Connect instances — 3 instances, one per edge (ADR-0023 6a).
  # Each consumes its edge's ingress-dis-raw, runs the same sim_dis_mapping
  # Bloblang (which preserves origin_node → Silver Provenance.edge_id/
  # region_id), and produces to its own edge's raw-sensor-stream. Only the
  # edge-01 instance maps host port 9999 for the diagnostic HTTP input;
  # the other two listen internally without host exposure.
  # =============================================================================
  redpanda-connect-01:
    container_name: openddil-demo-redpanda-connect-01
    image: docker.redpanda.com/redpandadata/connect:latest
    ports:
      - "9999:9999"
    environment:
      REDPANDA_BROKER: redpanda-edge-01:9092
    volumes:
      - ./openddil-base-connect.yaml:/connect.yaml
      - ./dynamic-mappings:/mappings
      - ../openddil-contracts/proto:/proto
      - ../openddil-contracts/ontology:/ontology:ro
    command: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
    depends_on:
      - redpanda-edge-01
      - toxiproxy

  redpanda-connect-02:
    container_name: openddil-demo-redpanda-connect-02
    image: docker.redpanda.com/redpandadata/connect:latest
    environment:
      REDPANDA_BROKER: redpanda-edge-02:9092
    volumes:
      - ./openddil-base-connect.yaml:/connect.yaml
      - ./dynamic-mappings:/mappings
      - ../openddil-contracts/proto:/proto
      - ../openddil-contracts/ontology:/ontology:ro
    command: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
    depends_on:
      - redpanda-edge-02
      - toxiproxy

  redpanda-connect-03:
    container_name: openddil-demo-redpanda-connect-03
    image: docker.redpanda.com/redpandadata/connect:latest
    environment:
      REDPANDA_BROKER: redpanda-edge-03:9092
    volumes:
      - ./openddil-base-connect.yaml:/connect.yaml
      - ./dynamic-mappings:/mappings
      - ../openddil-contracts/proto:/proto
      - ../openddil-contracts/ontology:/ontology:ro
    command: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
    depends_on:
      - redpanda-edge-03
      - toxiproxy

  # NOTE: the `simulator` service was removed in Phase 4b (ADR-0019 era).
  # Real ingestion goes through DIS / sim-a / proprietary feeds; the UI now
  # reads pipeline state from Postgres via ElectricSQL, not from a mock
  # simulator API. The SimulatorApp UI, the /simulator/* and /models/*
  # nginx routes, and this service block all went together.

  # =============================================================================
  # faust-edge — 3 instances, one per edge (ADR-0023 Phase 6a). Distinct
  # FAUST_APP_ID per instance namespaces each instance's consumer-group
  # and changelog topic names ("openddil-edge-NN-*-changelog") so the
  # partition-count invariant fix from Phase 5 step 1 (partitions=1 on
  # both Tables) carries through unchanged on a per-edge basis.
  # =============================================================================
  faust-edge-01:
    image: ghcr.io/edgy-solutions/openddil/faust-edge:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-edge-01
    working_dir: /tmp
    environment:
      PYTHONPATH:         /app
      FAUST_APP_ID:       openddil-edge-01
      KAFKA_BROKERS:      redpanda-edge-01:9092
      OPENDDIL_EDGE_ID:   edge-01
      OPENDDIL_REGION_ID: region-east
    depends_on:
      - redpanda-edge-01

  faust-edge-02:
    image: ghcr.io/edgy-solutions/openddil/faust-edge:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-edge-02
    working_dir: /tmp
    environment:
      PYTHONPATH:         /app
      FAUST_APP_ID:       openddil-edge-02
      KAFKA_BROKERS:      redpanda-edge-02:9092
      OPENDDIL_EDGE_ID:   edge-02
      OPENDDIL_REGION_ID: region-east
    depends_on:
      - redpanda-edge-02

  faust-edge-03:
    image: ghcr.io/edgy-solutions/openddil/faust-edge:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-edge-03
    working_dir: /tmp
    environment:
      PYTHONPATH:         /app
      FAUST_APP_ID:       openddil-edge-03
      KAFKA_BROKERS:      redpanda-edge-03:9092
      OPENDDIL_EDGE_ID:   edge-03
      OPENDDIL_REGION_ID: region-west
    depends_on:
      - redpanda-edge-03

  restate-server:
    # Bumped 2026-05-13 from 1.1.2 to 1.6.2 — restate-sdk-python 0.17.1
    # speaks a newer discovery protocol than 1.1.x supports (the older server
    # rejected handler registration with HTTP 415).
    image: restatedev/restate:1.6.2
    container_name: openddil-demo-restate-server
    command: ["-c", "/config/restate-config.toml"]
    volumes:
      - ./restate-config.toml:/config/restate-config.toml:ro
    ports:
      - "8080:8080"
      - "9070:9070"

  restate-hub:
    image: ghcr.io/edgy-solutions/openddil/hub-restate-projector:latest
    pull_policy: always
    container_name: openddil-demo-restate-hub
    entrypoint: ["/opt/venv/bin/python", "/app/restate_hub.py"]
    environment:
      DB_PATH: "/tmp/edge_state.db"
    volumes:
      - ../openddil-tactical-agents/hub/restate_hub.py:/app/restate_hub.py
    depends_on:
      - restate-server

  # ===========================================================================
  # Configuration Management Service (Phase 3, ADR-0014)
  # ===========================================================================
  # Restate Virtual Object "AssetCM" — one durable instance per asset_id.
  # Owns As-Maintained state, discrepancy analysis, and lifecycle transitions.
  # ASGI endpoint on :9080; Restate discovers handlers from there.
  # Kafka publisher (egress) targets redpanda-edge:9092 for asset-cm-state
  # and tactical-events; Kafka ingress is wired by cm-service-bootstrap.
  cm-service:
    image: ghcr.io/edgy-solutions/openddil/cm-service:latest
    pull_policy: always
    container_name: openddil-demo-cm-service
    environment:
      CM_BASELINES_DIR:       /baselines
      # ADR-0023 Phase 6b §A: cm-service consumes per-edge via Restate
      # (3 cluster registrations done by cm-service-bootstrap) but PRODUCES
      # asset-cm-state to redpanda-hq. Single Producer; per-asset rows on
      # hq carry edge_id from inbound provenance.
      CM_KAFKA_BROKERS:       redpanda-hq:19092
      CM_HTTP_PORT:           "9080"
      CM_STALENESS_WINDOW_S:  "900"
      LOG_LEVEL:              INFO
      PYTHONPATH:             /proto:/app/src
    volumes:
      # Cross-repo reference data mounted from the contracts source repo —
      # OSS contributors maintaining the contracts repo see updates without
      # rebuilding the cm-service image. Production deployments may
      # alternatively bake these into the image.
      - ../openddil-contracts/gen/python:/proto:ro
      - ../openddil-contracts/baselines:/baselines:ro
    ports:
      - "9080:9080"
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: registers cm-service with Restate and creates the Kafka
  # subscriptions for raw-sensor-stream and cm-events. Idempotent — safe
  # to re-run.
  # =============================================================================
  # Logistics Fusion Service (Phase 3.5, ADR-0014)
  # =============================================================================
  # Restate Virtual Object "AssetLogistics" — one durable instance per
  # asset_id. Consumes windowed telemetry + cm-state + Silver telemetry,
  # computes overall logistics severity via pure-Python rules, emits
  # AssetLogisticsStatusUpdate to asset-logistics-status. Kafka subscriptions
  # registered by logistics-fusion-bootstrap (below).
  logistics-fusion-service:
    image: ghcr.io/edgy-solutions/openddil/logistics-fusion-service:latest
    pull_policy: always
    container_name: openddil-demo-logistics-fusion-service
    environment:
      # ADR-0023 Phase 6b §A: fusion consumes per-edge via Restate (3
      # cluster registrations + 1 HQ cluster for asset-cm-state) but
      # PRODUCES asset-logistics-status to redpanda-hq. Single Producer;
      # per-asset rows on hq carry edge_id from inbound via _KEY_ORIGIN.
      FUSION_KAFKA_BROKERS:    redpanda-hq:19092
      FUSION_HTTP_PORT:        "9081"
      EMIT_INTERVAL_SECONDS:   "30"
      STALE_INPUT_SECONDS:     "300"
      ONTOLOGY_DIR:            /ontology
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
      - ../openddil-contracts/ontology:/ontology:ro
    ports:
      - "9081:9081"
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: registers logistics-fusion-service with Restate and creates the
  # Kafka subscriptions for asset-telemetry-windows, asset-cm-state, and
  # raw-sensor-stream. Idempotent (uses shared bootstrap library's dedup).
  logistics-fusion-bootstrap:
    # Reuses the same image as logistics-fusion-service; only the entrypoint
    # differs (the bootstrap wrapper script).
    image: ghcr.io/edgy-solutions/openddil/logistics-fusion-service:latest
    pull_policy: always
    container_name: openddil-demo-logistics-fusion-bootstrap
    entrypoint: ["python", "/app/bootstrap/register_subscriptions.py"]
    environment:
      RESTATE_ADMIN_URL:        http://restate-server:9070
      FUSION_SERVICE_ENDPOINT:  http://logistics-fusion-service:9081
      # ADR-0023 Phase 6b §A: per-edge clusters + HQ cluster for cm-state.
      FUSION_EDGE_CLUSTERS:     "edge-01=redpanda-edge-01:9092,edge-02=redpanda-edge-02:9092,edge-03=redpanda-edge-03:9092"
      FUSION_HQ_BROKERS:        redpanda-hq:19092
      LOG_LEVEL:                INFO
      PYTHONPATH:               /app
    volumes:
      - ../openddil-contracts/bootstrap:/app/openddil_bootstrap:ro
    depends_on:
      logistics-fusion-service:
        condition: service_started
      restate-server:
        condition: service_started
    restart: "no"

  cm-service-bootstrap:
    # Reuses the same image as cm-service; only the entrypoint differs.
    image: ghcr.io/edgy-solutions/openddil/cm-service:latest
    pull_policy: always
    container_name: openddil-demo-cm-service-bootstrap
    entrypoint: ["python", "/app/bootstrap/register_subscriptions.py"]
    environment:
      RESTATE_ADMIN_URL:    http://restate-server:9070
      CM_SERVICE_ENDPOINT:  http://cm-service:9080
      # ADR-0023 Phase 6b §A: per-edge clusters.
      CM_EDGE_CLUSTERS:     "edge-01=redpanda-edge-01:9092,edge-02=redpanda-edge-02:9092,edge-03=redpanda-edge-03:9092"
      LOG_LEVEL:            INFO
      PYTHONPATH:           /app
    volumes:
      # Shared bootstrap library — cross-repo Python module, mounted rather
      # than baked so updates to openddil-contracts/bootstrap propagate
      # without rebuilding every service image.
      - ../openddil-contracts/bootstrap:/app/openddil_bootstrap:ro
    depends_on:
      cm-service:
        condition: service_started
      restate-server:
        condition: service_started
    restart: "no"

  # =============================================================================
  # Projector (Phase 4a, ADR-0019)
  # =============================================================================
  # Single generic Kafka -> Postgres projector. Consumes the per-asset
  # pipeline topics (asset-cm-state, asset-logistics-status,
  # telemetry-latest-state, tactical-events, asset-telemetry-windows) and
  # UPSERTs them into the Postgres read-model tables that ElectricSQL
  # exposes as Shapes to the UI. One service, many subscriptions.
  #
  # Depends on atlas-init: the read-model tables must exist before the
  # projector can write them.
  # =============================================================================
  # Projectors — 3 instances, one per edge cluster (ADR-0023 Phase 6a).
  # confluent_kafka treats bootstrap.servers as a single Kafka cluster, so
  # 3 separate edge clusters require 3 separate consumer instances. All
  # three write to the same postgres-hq (per-asset rows UPSERT keyed by
  # asset_id; per-edge entity-ID ranges keep writes disjoint per
  # §Hero-scenario). Only projector-01 runs the edge_buffer_loop
  # (BUFFER_MONITOR_ENABLED gates it) — multi-edge buffer monitoring is
  # 6c rewire. telemetry_latest handler reads Provenance.edge_id from the
  # message; other handlers stay env-default in 6a.
  # =============================================================================
  openddil-projector-01:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-01
    environment:
      KAFKA_BROKERS:           redpanda-edge-01:9092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-01
      OPENDDIL_REGION_ID:      region-east
      BUFFER_MONITOR_ENABLED:  "true"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    ports:
      - "8084:8084"
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-projector-02:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-02
    environment:
      KAFKA_BROKERS:           redpanda-edge-02:9092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-02
      OPENDDIL_REGION_ID:      region-east
      BUFFER_MONITOR_ENABLED:  "false"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-edge-02:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-projector-03:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-03
    environment:
      KAFKA_BROKERS:           redpanda-edge-03:9092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-03
      OPENDDIL_REGION_ID:      region-west
      BUFFER_MONITOR_ENABLED:  "false"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-edge-03:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ADR-0023 Phase 6b §A: cm-service and logistics-fusion-service produce
  # asset-cm-state and asset-logistics-status to redpanda-hq (not per-edge,
  # because both are HQ-tier aggregated outputs in 6b). This 4th projector
  # instance consumes those HQ topics. Per-asset rows still UPSERT keyed by
  # asset_id; edge_id is read from the message-field provenance by the
  # cm_state / logistics_status handlers (Phase 6b §A switch).
  # BUFFER_MONITOR_ENABLED=false — only projector-01 runs the buffer
  # monitor.
  openddil-projector-hq:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-hq
    environment:
      KAFKA_BROKERS:           redpanda-hq:19092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-unspecified
      OPENDDIL_REGION_ID:      region-unspecified
      BUFFER_MONITOR_ENABLED:  "false"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-hq:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: ghcr.io/edgy-solutions/openddil/frontend:latest
    pull_policy: always
    container_name: openddil-demo-frontend
    ports:
      - "3017:80"
