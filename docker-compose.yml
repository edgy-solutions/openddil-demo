version: '3.8'

# =============================================================================
# OpenDDIL Demo — base compose (REGISTRY IMAGES ONLY)
# =============================================================================
# RULE: This file must contain ONLY `image:` references (pulled from
# ghcr.io / docker.io / etc.). It MUST NOT contain `build:` directives.
# Local builds, hot-reload source mounts, and other developer affordances
# live in docker-compose.override.yml, which `docker compose` auto-merges
# on top of this file when present.
#
# Rationale:
#   - The base compose models a deployable state — a customer or CI runner
#     should be able to `docker compose -f docker-compose.yml up` and get
#     a working system pulled from a registry without any source repos
#     present on disk.
#   - The override compose models a developer state — sibling repos
#     cloned next to openddil-demo, source bind-mounted into containers
#     for hot reload, image built locally rather than pulled.
#
# When adding a new service:
#   1. Push the image to ghcr.io/edgy-solutions/openddil/<service>:latest
#   2. Add the `image:` reference here.
#   3. Add the matching `build:` block (+ any dev mounts) in
#      docker-compose.override.yml.
#
# See AGENTS.md / llms.txt / .cursorrules in this repo for the rule.
# =============================================================================

services:
  # =========================================================================
  # Edge tier — 3 brokers, one per edge (ADR-0023 Phase 6a).
  # region-east carries edge-01 + edge-02; region-west carries edge-03.
  # Each broker is its own Kafka cluster; cross-edge data movement happens
  # only via the per-edge bridges to redpanda-hq.
  # =========================================================================
  redpanda-edge-01:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge-01:9092,OUTSIDE://localhost:9093
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-edge-02:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '2'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge-02:9092,OUTSIDE://localhost:9095
    ports:
      - "9094:9092"
      - "9095:9093"
      - "9645:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-edge-03:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '3'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-edge-03:9092,OUTSIDE://localhost:9097
    ports:
      - "9096:9092"
      - "9097:9093"
      - "9646:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-hq:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '1'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092,OUTSIDE://0.0.0.0:19093
      # The PLAINTEXT listener ADVERTISES the toxiproxy address, not its
      # own (Phase 4c.5). The edge-hq-bridge bootstraps via toxiproxy:8474,
      # and a Kafka client then connects directly to whatever address the
      # broker advertises — so for toxiproxy to actually mediate produce
      # traffic (and for the DDIL sever to be real), the broker must
      # advertise toxiproxy:8474. The bridge is redpanda-hq's only client.
      - --advertise-kafka-addr
      - PLAINTEXT://toxiproxy:8474,OUTSIDE://localhost:19093
    ports:
      - "19092:19092"
      - "19093:19093"
      - "19644:19644"
    # THE HQ BROKER HAD NO HEALTHCHECK while two services declared they waited
    # on its health — and `depends_on: condition: service_healthy` against a
    # container with no healthcheck is not a slow start, it is a hard refusal:
    #
    #   dependency failed to start: container ...-redpanda-hq-1
    #   has no healthcheck configured
    #
    # which means `docker compose up logistics-sim` has not been able to start
    # logistics-sim at all. Found while wiring the egress gate, which declared
    # the same dependency and hit the same wall. Same probe the three edge
    # brokers use. ADR-0043 §4.6 / LR-0043-D.
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # =============================================================================
  # Ontology overlay (ADR-0043)
  # =============================================================================
  # /ontology IS TWO DIRECTORIES, and compose could not say so. The chart
  # assembles it -- contracts/ontology first, demo/ontology on top -- and
  # every consumer sees one directory. Compose mounted only the contracts
  # half, so releasability.yaml was absent, the ingress mapping's
  # `file(path: "/ontology/releasability.yaml")` read nothing, and EVERY
  # RECORD ON THE COMPOSE STACK WAS UNLABELLED -- indistinguishable from a
  # fleet nobody ever declared.
  #
  # WHY A VOLUME AND NOT A SECOND BIND MOUNT. Binding the one demo file into
  # a read-only contracts directory fails outright:
  #     create mountpoint for /ontology/releasability.yaml:
  #     read-only file system
  # and binding it into a WRITABLE one succeeds by creating a zero-byte
  # releasability.yaml inside the contracts repo on the host. A zero-byte
  # declaration parses as a fleet of no assets, so that workaround's failure
  # mode is a stack that labels nothing while every mount looks correct. The
  # two empty directories still sitting in ontology/ named after contracts
  # files are the fossil of an earlier attempt at it.
  #
  # So: one throwaway container assembles the overlay into a named volume
  # with the precedence the chart uses, and every consumer mounts the result
  # read-only. Idempotent; re-runs on every `up`.
  ontology-overlay:
    image: busybox:1.36
    container_name: openddil-demo-ontology-overlay
    command:
      - sh
      - -c
      - |
        set -e
        rm -rf /out/* || true
        cp -a /contracts/. /out/
        # Files only. ontology/ contains directories named after contracts
        # files (see above); copying one over a real contracts entry would
        # replace a populated ontology file with an empty folder.
        for f in /demo/*.yaml; do
          [ -f "$$f" ] && cp -a "$$f" /out/
        done
        echo "INFO: /ontology assembled (contracts + demo overlay):"
        ls -la /out
    volumes:
      - ../openddil-contracts/ontology:/contracts:ro
      - ./ontology:/demo:ro
      - ontology:/out
    restart: "no"

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-edge-02:
        condition: service_healthy
      redpanda-edge-03:
        condition: service_healthy
      redpanda-hq:
        condition: service_started
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        # ADR-0023 Phase 6a: each edge broker is its own Kafka cluster; the
        # same topic shapes are created on each so per-edge produce/consume
        # works identically across the 3 edges.
        for B in redpanda-edge-01:9092 redpanda-edge-02:9092 redpanda-edge-03:9092 redpanda-hq:19092; do
          echo "INFO: Initializing topics on $$B..."
          rpk -X brokers=$$B topic create raw-sensor-stream \
              -p 1 -r 1 \
              -c retention.ms=86400000 \
              || true
          rpk -X brokers=$$B topic create ingress-dlq \
              -p 1 -r 1 \
              -c retention.ms=604800000 \
              || true
          rpk -X brokers=$$B topic create telemetry-latest-state \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              || true
          rpk -X brokers=$$B topic create tactical-events \
              -p 4 -r 1 \
              -c retention.ms=2592000000 \
              || true
          rpk -X brokers=$$B topic create asset-cm-state \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create cm-items \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create cm-events \
              -p 8 -r 1 \
              -c cleanup.policy=compact,delete \
              -c retention.ms=2592000000 \
              || true
          rpk -X brokers=$$B topic create ingress-dis-raw \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c compression.type=zstd \
              || true
          rpk -X brokers=$$B topic create ingress-proprietary-raw \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c compression.type=zstd \
              || true
          rpk -X brokers=$$B topic create ingress-sim-a-raw \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c compression.type=zstd \
              || true
          # Customer-bundle StrikeCapabilityMessage feed (Sub-phase A of
          # recipe v3, 2026-05-19): Bronze raw JSON + Silver normalized
          # AssetCapabilitySnapshot. The customer-overlay overlay's connect
          # pair (connect-strike-capability-amqp.yaml + connect-strike-
          # capability.yaml) produces to these topics; downstream (yet
          # to land in this pre-Sub-phase-E commit) will be a projector
          # to postgres-hq plus a delta-tracker for barrel-life rounds-
          # fired derivation.
          rpk -X brokers=$$B topic create ingress-strike-capability-raw \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c compression.type=zstd \
              || true
          rpk -X brokers=$$B topic create asset-capability-snapshot \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create asset-telemetry-windows \
              -p 8 -r 1 \
              -c retention.ms=86400000 \
              -c cleanup.policy=delete \
              || true
          rpk -X brokers=$$B topic create asset-logistics-status \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create derived-sustainment \
              -p 1 -r 1 \
              -c retention.ms=86400000 \
              || true
          # ADR-0023 Phase 6b §B — regional rollup output topics. Produced
          # by faust-regional aggregator to redpanda-hq; created on every
          # broker for projector subscription parity (per-edge projectors
          # subscribe but find no data; only projector-hq populates the
          # tables — same shape as the §A asset-cm-state/asset-logistics-
          # status migration to hq).
          rpk -X brokers=$$B topic create region-fleet-summary \
              -p 1 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create region-top-factors \
              -p 1 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          rpk -X brokers=$$B topic create region-wear-trends \
              -p 1 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          # ADR-0028: asset_id -> (edge_id, region_id) changelog. Produced
          # by asset-registry-service on the hq broker; subscribed by the
          # faust-regional HQ source App (and future projector / cm-service
          # consumers per Phase 3+). Created on every broker for the same
          # subscription-parity reason as the §B rollup topics above.
          rpk -X brokers=$$B topic create asset-registry-events \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              || true
          # Phase 9: per-asset element telemetry from openddil-logistics-sim.
          # Compacted, keyed by asset_id — projector upserts the latest
          # envelope into asset_element_telemetry per asset. logistics-sim
          # PRODUCES to redpanda-hq only; topic created on every broker for
          # subscription-parity (same pattern as asset-cm-state above).
          # max.message.bytes raised to 16MB to fit the full per-asset
          # element TREE (~5MB for MRAD at 23k elements with path-encoded
          # ids — see openddil-logistics-sim element_gen.py). Producer
          # max_request_size and consumer fetch.message.max.bytes both
          # match (publisher.py / projector main.py).
          rpk -X brokers=$$B topic create asset-element-telemetry \
              -p 8 -r 1 \
              -c cleanup.policy=compact \
              -c min.cleanable.dirty.ratio=0.1 \
              -c segment.ms=60000 \
              -c retention.ms=-1 \
              -c max.message.bytes=16777216 \
              || true
          echo "INFO: Topics initialized on $$B."
        done
        # ADR-0023 Phase 6b §B — per-region fan-in topics. Pipeline
        # internals (NOT persistent state) so configured for short
        # retention; faust-regional source Apps produce here from each
        # source edge cluster via aiokafka sidecar, aggregator App
        # consumes on its hq broker. Created on hq ONLY — per-edge brokers
        # never see fan-in traffic. partitions=1 matches the aggregator's
        # Tables partition invariant (same discipline as
        # prognostics_accumulators in faust-edge).
        echo "INFO: Initializing per-region fan-in topics on redpanda-hq..."
        for FAN_IN in region-east-fan-in region-west-fan-in; do
          rpk -X brokers=redpanda-hq:19092 topic create $$FAN_IN \
              -p 1 -r 1 \
              -c cleanup.policy=delete \
              -c retention.ms=3600000 \
              || true
        done
        # ADR-0043 Arc 2 Slice 2 — what the egress gate has ADMITTED toward
        # the C2 stand-in. HQ ONLY, and deliberately not created on the edge
        # brokers: a topic that exists on a tier is a topic something on that
        # tier can produce to, and the gate's whole claim is that there is
        # ONE boundary. Mirrors asset-logistics-status's config exactly
        # (compacted, 8 partitions, keyed by asset_id) so that a difference
        # between what the source holds and what this holds is a decision the
        # gate made, never an artifact of how the two topics were configured.
        echo "INFO: Initializing egress topics on redpanda-hq..."
        rpk -X brokers=redpanda-hq:19092 topic create egress-c2-status             -p 8 -r 1             -c cleanup.policy=compact             -c min.cleanable.dirty.ratio=0.1             -c segment.ms=60000             -c retention.ms=-1             || true
        echo "INFO: All topics initialized across all 3 edge brokers + hq."

  postgres-hq:
    image: postgres:15
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openddil
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openddil"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply the canonical Atlas schema to postgres-hq, then create
  # the ElectricSQL publication. Runs after postgres-hq is healthy; exits 0
  # on success. Without this, postgres-hq comes up with zero tables and
  # every downstream consumer (Electric, projector, UI shapes) silently
  # fails. The schema lives in openddil-stack/ (single canonical location);
  # `migrations/` is committed alongside it.
  atlas-init:
    image: arigaio/atlas:latest
    container_name: openddil-demo-atlas-init
    depends_on:
      postgres-hq:
        condition: service_healthy
    volumes:
      - ../openddil-stack/schema:/schema:ro
    # The arigaio/atlas image has no shell — `atlas` is the entrypoint, so
    # `command:` carries only the subcommand args. Matches the atlas-init
    # block in openddil-stack/docker-compose.yml.
    command:
      - "migrate"
      - "apply"
      - "--dir"
      - "file:///schema/migrations"
      - "--url"
      - "postgres://postgres:password@postgres-hq:5432/openddil?sslmode=disable"
    restart: "no"

  # Postgres-side ElectricSQL setup: creates the publication that the
  # electric-sync service reads. Runs after atlas-init has created the
  # tables. Separate from atlas-init because Atlas owns DDL; this owns
  # publications/replication-role grants.
  electric-publish-init:
    image: postgres:15
    container_name: openddil-demo-electric-publish-init
    depends_on:
      atlas-init:
        condition: service_completed_successfully
    volumes:
      - ../openddil-stack/electric:/electric:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[electric-publish-init] applying publication..."
        PGPASSWORD=password psql -v ON_ERROR_STOP=1 \
          -h postgres-hq -U postgres -d openddil \
          -f /electric/electrify.sql
        echo "[electric-publish-init] publication ready"
    restart: "no"

  electric-sync:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres-hq:5432/openddil
      LOGICAL_PUBLISHER_HOST: electric-sync
      AUTH_JWT_ALG: HS256
      AUTH_JWT_KEY: "secret"
      ELECTRIC_INSECURE: "true"
      # ElectricSQL defaults to binding port 3000 inside the container. The
      # host port mapping below assumes it listens on 5133 — set the bind
      # port explicitly so the two agree. The env var is ELECTRIC_PORT (not
      # PORT — confirmed against the image's own healthcheck,
      # `curl http://localhost:${ELECTRIC_PORT-3000}/v1/health`). Phase 4a
      # fix; previously the 5133->5133 mapping pointed at nothing and every
      # shape request died as "Empty reply from server."
      ELECTRIC_PORT: "5133"
    ports:
      - "5133:5133"
    depends_on:
      postgres-hq:
        condition: service_healthy
      electric-publish-init:
        condition: service_completed_successfully

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474" # Proxy port
      - "8475:8475" # API port
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json
    # `-config` was missing before Phase 4c.5 — toxiproxy.json was mounted
    # but never loaded, so the hq-link proxy did not exist at runtime and
    # the DDIL sever demo was a no-op. Loading the config registers
    # hq-link (edge -> redpanda-hq:19092) so the WAN sever is real.
    #
    # ADR-0023 Phase 6a: kept at ONE proxy (the existing hq-link on 8474)
    # rather than expanding to 3 per-edge proxies, because per-edge
    # severability at the bridge transport requires per-edge HQ broker
    # listeners (redpanda-hq advertises ONE address; with 3 proxies, all
    # bridges still end up routing follow-up traffic through whatever the
    # broker advertises — same convincing-fake failure mode ADR-0021 §The
    # runtime-verification lesson describes). 6a ships cluster-tier
    # severability ("sever the link, all bridges stop"); true per-edge
    # severability is 6c rewire alongside the UI multi-edge toggle work.
    command: -host 0.0.0.0 -port 8475 -config /etc/toxiproxy.json

  # =============================================================================
  # Edge -> HQ bridges (Phase 4c.5 / ADR-0023 Phase 6a)
  # =============================================================================
  # Three bridges, one per edge, each with its own consumer-group name so
  # per-edge bridge-group lag is readable in rpk. All three currently write
  # through the single toxiproxy hq-link proxy — true per-edge severability
  # at the bridge transport requires per-edge HQ broker listeners
  # (deferred to 6c rewire alongside the UI multi-edge toggle work). For
  # 6a the demonstrated severability is cluster-tier ("sever the link,
  # all 3 edges' bridges stop"); per-edge attribution on the read-model
  # side is verified via the EDGE ATTRIBUTION panel which reads
  # telemetry_latest_state.edge_id directly (independent path).
  edge-hq-bridge-01:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: openddil-demo-edge-hq-bridge-01
    volumes:
      - ./redpanda-connect-edge-01.yaml:/connect.yaml:ro
    command: ["--chilled", "run", "/connect.yaml"]
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      redpanda-hq:
        condition: service_started
    restart: unless-stopped

  edge-hq-bridge-02:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: openddil-demo-edge-hq-bridge-02
    volumes:
      - ./redpanda-connect-edge-02.yaml:/connect.yaml:ro
    command: ["--chilled", "run", "/connect.yaml"]
    depends_on:
      redpanda-edge-02:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      redpanda-hq:
        condition: service_started
    restart: unless-stopped

  edge-hq-bridge-03:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: openddil-demo-edge-hq-bridge-03
    volumes:
      - ./redpanda-connect-edge-03.yaml:/connect.yaml:ro
    command: ["--chilled", "run", "/connect.yaml"]
    depends_on:
      redpanda-edge-03:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      redpanda-hq:
        condition: service_started
    restart: unless-stopped

  # NOTE: RabbitMQ, the System A AMQP-ingress Connect container, the System B
  # AMQP-egress Connect container, and the proprietary-ingest sidecar are
  # CUSTOMER-ENCUMBERED service blocks. They live in the customer overlay
  # at openddil-customer-bundle/docker-compose.customer.yml — NOT in this
  # public file. To run the full demo with customer feeds, layer the overlay:
  #
  #   docker compose \
  #     -f openddil-demo/docker-compose.yml \
  #     -f openddil-customer-bundle/docker-compose.customer.yml \
  #     up

  # =============================================================================
  # Sensor-ingest — 3 instances, one per edge (ADR-0023 Phase 6a).
  # Each listens on a distinct host UDP port and stamps its OPENDDIL_EDGE_ID
  # into Bronze JSON (DIS-mapper Bloblang preserves through to Silver
  # Provenance.edge_id / region_id). Entity-range partitioning is
  # test-side discipline — sensor-ingest stays a pure UDP→Kafka transport.
  # =============================================================================
  openddil-sensor-ingest-01:
    image: ghcr.io/edgy-solutions/openddil/sensor-ingest:latest
    pull_policy: always
    container_name: openddil-demo-sensor-ingest-01
    command: python dis_ingestor.py
    ports:
      - "62040:62040/udp"
      - "8081:8080"
    environment:
      KAFKA_BROKERS:      redpanda-edge-01:9092
      KAFKA_TOPIC:        ingress-dis-raw
      OPENDDIL_EDGE_ID:   edge-01
      OPENDDIL_REGION_ID: region-east
      LOG_LEVEL:          INFO
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-sensor-ingest-02:
    image: ghcr.io/edgy-solutions/openddil/sensor-ingest:latest
    pull_policy: always
    container_name: openddil-demo-sensor-ingest-02
    command: python dis_ingestor.py
    ports:
      - "62041:62041/udp"
      - "8082:8080"
    environment:
      UDP_PORT:           "62041"
      KAFKA_BROKERS:      redpanda-edge-02:9092
      KAFKA_TOPIC:        ingress-dis-raw
      OPENDDIL_EDGE_ID:   edge-02
      OPENDDIL_REGION_ID: region-east
      LOG_LEVEL:          INFO
    depends_on:
      redpanda-edge-02:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-sensor-ingest-03:
    image: ghcr.io/edgy-solutions/openddil/sensor-ingest:latest
    pull_policy: always
    container_name: openddil-demo-sensor-ingest-03
    command: python dis_ingestor.py
    ports:
      - "62042:62042/udp"
      - "8083:8080"
    environment:
      UDP_PORT:           "62042"
      KAFKA_BROKERS:      redpanda-edge-03:9092
      KAFKA_TOPIC:        ingress-dis-raw
      OPENDDIL_EDGE_ID:   edge-03
      OPENDDIL_REGION_ID: region-west
      LOG_LEVEL:          INFO
    depends_on:
      redpanda-edge-03:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Customer-feed sidecars (openddil-proprietary-ingest, the System A AMQP
  # Connect, and the System B AMQP egress Connect) live in the customer
  # overlay — see the note near the toxiproxy block above.

  # =============================================================================
  # DIS-mapper Connect instances — 3 instances, one per edge (ADR-0023 6a).
  # Each consumes its edge's ingress-dis-raw, runs the same sim_dis_mapping
  # Bloblang (which preserves origin_node → Silver Provenance.edge_id/
  # region_id), and produces to its own edge's raw-sensor-stream. Only the
  # edge-01 instance maps host port 9999 for the diagnostic HTTP input;
  # the other two listen internally without host exposure.
  # =============================================================================
  redpanda-connect-01:
    container_name: openddil-demo-redpanda-connect-01
    image: docker.redpanda.com/redpandadata/connect:latest
    ports:
      - "9999:9999"
    environment:
      REDPANDA_BROKER: redpanda-edge-01:9092
    volumes:
      - ./openddil-base-connect.yaml:/connect.yaml
      - ./dynamic-mappings:/mappings
      - ../openddil-contracts/proto:/proto
      - ontology:/ontology:ro
    command: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      ontology-overlay:
        condition: service_completed_successfully

  redpanda-connect-02:
    container_name: openddil-demo-redpanda-connect-02
    image: docker.redpanda.com/redpandadata/connect:latest
    environment:
      REDPANDA_BROKER: redpanda-edge-02:9092
    volumes:
      - ./openddil-base-connect.yaml:/connect.yaml
      - ./dynamic-mappings:/mappings
      - ../openddil-contracts/proto:/proto
      - ontology:/ontology:ro
    command: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
    depends_on:
      redpanda-edge-02:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      ontology-overlay:
        condition: service_completed_successfully

  redpanda-connect-03:
    container_name: openddil-demo-redpanda-connect-03
    image: docker.redpanda.com/redpandadata/connect:latest
    environment:
      REDPANDA_BROKER: redpanda-edge-03:9092
    volumes:
      - ./openddil-base-connect.yaml:/connect.yaml
      - ./dynamic-mappings:/mappings
      - ../openddil-contracts/proto:/proto
      - ontology:/ontology:ro
    command: ["--chilled", "run", "-r", "/mappings/*.yaml", "/connect.yaml"]
    depends_on:
      redpanda-edge-03:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      ontology-overlay:
        condition: service_completed_successfully

  # NOTE: the `simulator` service was removed in Phase 4b (ADR-0019 era).
  # Real ingestion goes through DIS / sim-a / proprietary feeds; the UI now
  # reads pipeline state from Postgres via ElectricSQL, not from a mock
  # simulator API. The SimulatorApp UI, the /simulator/* and /models/*
  # nginx routes, and this service block all went together.

  # =============================================================================
  # faust-edge — 3 instances, one per edge (ADR-0023 Phase 6a). Distinct
  # FAUST_APP_ID per instance namespaces each instance's consumer-group
  # and changelog topic names ("openddil-edge-NN-*-changelog") so the
  # partition-count invariant fix from Phase 5 step 1 (partitions=1 on
  # both Tables) carries through unchanged on a per-edge basis.
  # =============================================================================
  faust-edge-01:
    image: ghcr.io/edgy-solutions/openddil/faust-edge:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-edge-01
    working_dir: /tmp
    environment:
      PYTHONPATH:         /app
      FAUST_APP_ID:       openddil-edge-01
      KAFKA_BROKERS:      redpanda-edge-01:9092
      OPENDDIL_EDGE_ID:   edge-01
      OPENDDIL_REGION_ID: region-east
    depends_on:
      - redpanda-edge-01

  faust-edge-02:
    image: ghcr.io/edgy-solutions/openddil/faust-edge:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-edge-02
    working_dir: /tmp
    environment:
      PYTHONPATH:         /app
      FAUST_APP_ID:       openddil-edge-02
      KAFKA_BROKERS:      redpanda-edge-02:9092
      OPENDDIL_EDGE_ID:   edge-02
      OPENDDIL_REGION_ID: region-east
    depends_on:
      - redpanda-edge-02

  faust-edge-03:
    image: ghcr.io/edgy-solutions/openddil/faust-edge:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-edge-03
    working_dir: /tmp
    environment:
      PYTHONPATH:         /app
      FAUST_APP_ID:       openddil-edge-03
      KAFKA_BROKERS:      redpanda-edge-03:9092
      OPENDDIL_EDGE_ID:   edge-03
      OPENDDIL_REGION_ID: region-west
    depends_on:
      - redpanda-edge-03

  # =============================================================================
  # faust-regional — 2 instances, one per region (ADR-0023 Phase 6b §B).
  # =============================================================================
  # Each container composes multiple faust.App instances in a single Python
  # process via faust.Worker(aggregator, *source_apps): one source App per
  # source edge (consumes from edge's Kafka cluster, wraps in
  # RegionalAggregatorInput envelope, produces to per-region fan-in topic on
  # hq via aiokafka sidecar) + one aggregator App on hq (consumes fan-in +
  # asset-cm-state, owns Tables, emits 3 rolled-up topics on 30s heartbeat).
  #
  # Region-edge mapping per ADR-0023:
  #   region-east = {edge-01, edge-02}   (2 source Apps)
  #   region-west = {edge-03}            (1 source App, degenerate but
  #                                       same shape — symmetric testing
  #                                       and observability surfaces)
  #
  # See openddil-tactical-agents/regional/README.md for the Worker
  # composition coupling note (intentional process-level coupling; Kafka
  # durability handles restart).
  # =============================================================================
  faust-regional-east:
    image: ghcr.io/edgy-solutions/openddil/faust-regional:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-regional-east
    working_dir: /tmp
    environment:
      PYTHONPATH:                       /app
      OPENDDIL_REGION_ID:               region-east
      REGIONAL_EDGES:                   "edge-01=redpanda-edge-01:9092,edge-02=redpanda-edge-02:9092"
      REGIONAL_HQ_BROKERS:              redpanda-hq:19092
      REGIONAL_FAN_IN_TOPIC:            region-east-fan-in
      REGIONAL_HEARTBEAT_INTERVAL_S:    "30"
      REGIONAL_TOP_FACTORS_N:           "10"
      REGIONAL_ASSET_REGISTRY_TOPIC:    asset-registry-events
      LOG_LEVEL:                        INFO
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redpanda-edge-01:
        condition: service_healthy
      redpanda-edge-02:
        condition: service_healthy
      redpanda-hq:
        condition: service_started

  faust-regional-west:
    image: ghcr.io/edgy-solutions/openddil/faust-regional:latest
    pull_policy: always
    restart: always
    container_name: openddil-demo-faust-regional-west
    working_dir: /tmp
    environment:
      PYTHONPATH:                       /app
      OPENDDIL_REGION_ID:               region-west
      REGIONAL_EDGES:                   "edge-03=redpanda-edge-03:9092"
      REGIONAL_HQ_BROKERS:              redpanda-hq:19092
      REGIONAL_FAN_IN_TOPIC:            region-west-fan-in
      REGIONAL_HEARTBEAT_INTERVAL_S:    "30"
      REGIONAL_TOP_FACTORS_N:           "10"
      REGIONAL_ASSET_REGISTRY_TOPIC:    asset-registry-events
      LOG_LEVEL:                        INFO
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redpanda-edge-03:
        condition: service_healthy
      redpanda-hq:
        condition: service_started

  restate-server:
    # Bumped 2026-05-13 from 1.1.2 to 1.6.2 — restate-sdk-python 0.17.1
    # speaks a newer discovery protocol than 1.1.x supports (the older server
    # rejected handler registration with HTTP 415).
    image: restatedev/restate:1.6.2
    container_name: openddil-demo-restate-server
    command: ["-c", "/config/restate-config.toml"]
    volumes:
      - ./restate-config.toml:/config/restate-config.toml:ro
    ports:
      - "8080:8080"
      - "9070:9070"

  restate-hub:
    image: ghcr.io/edgy-solutions/openddil/hub-restate-projector:latest
    pull_policy: always
    container_name: openddil-demo-restate-hub
    entrypoint: ["/opt/venv/bin/python", "/app/restate_hub.py"]
    environment:
      DB_PATH: "/tmp/edge_state.db"
    volumes:
      - ../openddil-tactical-agents/hub/restate_hub.py:/app/restate_hub.py
    depends_on:
      - restate-server

  # ===========================================================================
  # Configuration Management Service (Phase 3, ADR-0014)
  # ===========================================================================
  # Restate Virtual Object "AssetCM" — one durable instance per asset_id.
  # Owns As-Maintained state, discrepancy analysis, and lifecycle transitions.
  # ASGI endpoint on :9080; Restate discovers handlers from there.
  # Kafka publisher (egress) targets redpanda-edge:9092 for asset-cm-state
  # and tactical-events; Kafka ingress is wired by cm-service-bootstrap.
  cm-service:
    image: ghcr.io/edgy-solutions/openddil/cm-service:latest
    pull_policy: always
    container_name: openddil-demo-cm-service
    environment:
      CM_BASELINES_DIR:       /baselines
      # ADR-0023 Phase 6b §A: cm-service consumes per-edge via Restate
      # (3 cluster registrations done by cm-service-bootstrap) but PRODUCES
      # asset-cm-state to redpanda-hq. Single Producer; per-asset rows on
      # hq carry edge_id from inbound provenance.
      CM_KAFKA_BROKERS:       redpanda-hq:19092
      CM_HTTP_PORT:           "9080"
      CM_STALENESS_WINDOW_S:  "900"
      LOG_LEVEL:              INFO
      PYTHONPATH:             /proto:/app/src
    volumes:
      # Cross-repo reference data mounted from the contracts source repo —
      # OSS contributors maintaining the contracts repo see updates without
      # rebuilding the cm-service image. Production deployments may
      # alternatively bake these into the image.
      - ../openddil-contracts/gen/python:/proto:ro
      - ../openddil-contracts/baselines:/baselines:ro
    ports:
      - "9080:9080"
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: registers cm-service with Restate and creates the Kafka
  # subscriptions for raw-sensor-stream and cm-events. Idempotent — safe
  # to re-run.
  # =============================================================================
  # Asset Registry Service (ADR-0028 Phase 1) -- canonical writer for
  # public.asset_registry, the single source of truth for asset ->
  # edge_id -> region_id. One pod, multi-broker Faust composition
  # (one App per source edge), shared asyncpg pool, single HQ producer
  # sidecar publishing asset-registry-events for consumer caches.
  # =============================================================================
  asset-registry-service:
    image: ghcr.io/edgy-solutions/openddil/asset-registry-service:latest
    pull_policy: always
    container_name: openddil-demo-asset-registry-service
    environment:
      ASSET_REGISTRY_POSTGRES_DSN:   postgres://postgres:password@postgres-hq:5432/openddil
      # One App per edge. Each App consumes telemetry-latest-state on
      # its assigned broker; the shared HQ producer sidecar publishes
      # asset-registry-events on redpanda-hq.
      ASSET_REGISTRY_EDGES:          "edge-01=redpanda-edge-01:9092,edge-02=redpanda-edge-02:9092,edge-03=redpanda-edge-03:9092"
      ASSET_REGISTRY_KAFKA_BROKERS:  redpanda-hq:19092
      ASSET_REGISTRY_INPUT_TOPIC:    telemetry-latest-state
      ASSET_REGISTRY_OUTPUT_TOPIC:   asset-registry-events
      # Per-edge static region fallback (config.py:_parse_edge_regions).
      # Used ONLY when edge_assignment.yaml is absent or returns the
      # "unspecified" fallback -- the OSS/demo case. Mirrors the
      # sensor-ingest OPENDDIL_REGION_ID stamping discipline so the
      # registry produces the same (edge, region) mapping the rest of
      # the demo system was built around.
      ASSET_REGISTRY_EDGE_REGIONS:   "edge-01=region-east,edge-02=region-east,edge-03=region-west"
      ASSET_REGISTRY_WEB_PORT:       "6070"
      LOG_LEVEL:                     INFO
      PYTHONPATH:                    /proto:/app/src
    volumes:
      # Proto bindings -- same mount pattern projector + cm-service use.
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-edge-02:
        condition: service_healthy
      redpanda-edge-03:
        condition: service_healthy
      redpanda-hq:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # =============================================================================
  # Logistics Fusion Service (Phase 3.5, ADR-0014)
  # =============================================================================
  # Restate Virtual Object "AssetLogistics" — one durable instance per
  # asset_id. Consumes windowed telemetry + cm-state + Silver telemetry,
  # computes overall logistics severity via pure-Python rules, emits
  # AssetLogisticsStatusUpdate to asset-logistics-status. Kafka subscriptions
  # registered by logistics-fusion-bootstrap (below).
  logistics-fusion-service:
    image: ghcr.io/edgy-solutions/openddil/logistics-fusion-service:latest
    pull_policy: always
    container_name: openddil-demo-logistics-fusion-service
    environment:
      # ADR-0023 Phase 6b §A: fusion consumes per-edge via Restate (3
      # cluster registrations + 1 HQ cluster for asset-cm-state) but
      # PRODUCES asset-logistics-status to redpanda-hq. Single Producer;
      # per-asset rows on hq carry edge_id from inbound via _KEY_ORIGIN.
      FUSION_KAFKA_BROKERS:    redpanda-hq:19092
      FUSION_HTTP_PORT:        "9081"
      EMIT_INTERVAL_SECONDS:   "30"
      STALE_INPUT_SECONDS:     "300"
      ONTOLOGY_DIR:            /ontology
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
      - ontology:/ontology:ro
    ports:
      - "9081:9081"
    depends_on:
      ontology-overlay:
        condition: service_completed_successfully
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: registers logistics-fusion-service with Restate and creates the
  # Kafka subscriptions for asset-telemetry-windows, asset-cm-state, and
  # raw-sensor-stream. Idempotent (uses shared bootstrap library's dedup).
  logistics-fusion-bootstrap:
    # Reuses the same image as logistics-fusion-service; only the entrypoint
    # differs (the bootstrap wrapper script).
    image: ghcr.io/edgy-solutions/openddil/logistics-fusion-service:latest
    pull_policy: always
    container_name: openddil-demo-logistics-fusion-bootstrap
    entrypoint: ["python", "/app/bootstrap/register_subscriptions.py"]
    environment:
      RESTATE_ADMIN_URL:        http://restate-server:9070
      FUSION_SERVICE_ENDPOINT:  http://logistics-fusion-service:9081
      # ADR-0023 Phase 6b §A: per-edge clusters + HQ cluster for cm-state.
      FUSION_EDGE_CLUSTERS:     "edge-01=redpanda-edge-01:9092,edge-02=redpanda-edge-02:9092,edge-03=redpanda-edge-03:9092"
      FUSION_HQ_BROKERS:        redpanda-hq:19092
      LOG_LEVEL:                INFO
      PYTHONPATH:               /app
    volumes:
      - ../openddil-contracts/bootstrap:/app/openddil_bootstrap:ro
    depends_on:
      logistics-fusion-service:
        condition: service_started
      restate-server:
        condition: service_started
    restart: "no"

  # =============================================================================
  # Logistics Sim (Phase 9) — per-element sub-component telemetry generator
  # =============================================================================
  # Subscribes to telemetry-latest-state on each edge broker, builds a roster
  # of assets whose platform_variant matches one of the configured asset
  # profiles (MRAD today; LTAMDS / Patriot to follow as config additions),
  # and on every tick publishes a per-asset element snapshot to
  # asset-element-telemetry on redpanda-hq. The projector handler at
  # openddil-projector/src/handlers/asset_element_telemetry.py upserts into
  # the asset_element_telemetry postgres table; the SensorArrayView reads
  # via useAssetElementTelemetry (ElectricSQL shape).
  #
  # Replaces the frontend's seeded-RNG synthesis fallback — this is now the
  # single source of truth for per-element health / temp / load and for
  # the tx_active / rx_active state propagated from the customer feed.
  logistics-sim:
    image: ghcr.io/edgy-solutions/openddil/logistics-sim:latest
    pull_policy: always
    container_name: openddil-demo-logistics-sim
    environment:
      LOGISTICS_SIM_HQ_BROKERS:           redpanda-hq:19092
      LOGISTICS_SIM_EDGE_CLUSTERS:        "edge-01=redpanda-edge-01:9092,edge-02=redpanda-edge-02:9092,edge-03=redpanda-edge-03:9092"
      LOGISTICS_SIM_INPUT_TOPIC:          telemetry-latest-state
      LOGISTICS_SIM_CONSUMER_GROUP_PREFIX: logistics-sim
      LOGISTICS_SIM_CONFIG_PATH:          /app/config/default.yaml
      # ADR-0043: THE PRODUCER LABELS. The declaration is read from the same
      # overlaid /ontology the ingress mapping reads, so the sensor path and
      # the element path cannot label the same asset two different ways.
      LOGISTICS_SIM_RELEASABILITY_PATH:   /ontology/releasability.yaml
      # DELIBERATELY UNSET, and this comment is the reason. A site nation here
      # would label every asset this instance emits, including assets the
      # declaration does not name — which is a blanket default wearing the
      # costume of deployment identity, and the exact thing the declaration's
      # own `default_originator_nation: null` refuses. An undeclared asset
      # stays unlabelled and is refused at the gate, visibly. Set it only for
      # a deployment whose site genuinely authors everything it emits.
      #   LOGISTICS_SIM_SITE_NATION:      ATL
      LOG_LEVEL:                          INFO
    volumes:
      - ontology:/ontology:ro
    depends_on:
      ontology-overlay:
        condition: service_completed_successfully
      redpanda-edge-01:
        condition: service_healthy
      redpanda-edge-02:
        condition: service_healthy
      redpanda-edge-03:
        condition: service_healthy
      redpanda-hq:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  cm-service-bootstrap:
    # Reuses the same image as cm-service; only the entrypoint differs.
    image: ghcr.io/edgy-solutions/openddil/cm-service:latest
    pull_policy: always
    container_name: openddil-demo-cm-service-bootstrap
    entrypoint: ["python", "/app/bootstrap/register_subscriptions.py"]
    environment:
      RESTATE_ADMIN_URL:    http://restate-server:9070
      CM_SERVICE_ENDPOINT:  http://cm-service:9080
      # ADR-0023 Phase 6b §A: per-edge clusters.
      CM_EDGE_CLUSTERS:     "edge-01=redpanda-edge-01:9092,edge-02=redpanda-edge-02:9092,edge-03=redpanda-edge-03:9092"
      LOG_LEVEL:            INFO
      PYTHONPATH:           /app
    volumes:
      # Shared bootstrap library — cross-repo Python module, mounted rather
      # than baked so updates to openddil-contracts/bootstrap propagate
      # without rebuilding every service image.
      - ../openddil-contracts/bootstrap:/app/openddil_bootstrap:ro
    depends_on:
      cm-service:
        condition: service_started
      restate-server:
        condition: service_started
    restart: "no"

  # =============================================================================
  # Projector (Phase 4a, ADR-0019)
  # =============================================================================
  # Single generic Kafka -> Postgres projector. Consumes the per-asset
  # pipeline topics (asset-cm-state, asset-logistics-status,
  # telemetry-latest-state, tactical-events, asset-telemetry-windows) and
  # UPSERTs them into the Postgres read-model tables that ElectricSQL
  # exposes as Shapes to the UI. One service, many subscriptions.
  #
  # Depends on atlas-init: the read-model tables must exist before the
  # projector can write them.
  # =============================================================================
  # Projectors — 3 instances, one per edge cluster (ADR-0023 Phase 6a).
  # confluent_kafka treats bootstrap.servers as a single Kafka cluster, so
  # 3 separate edge clusters require 3 separate consumer instances. All
  # three write to the same postgres-hq (per-asset rows UPSERT keyed by
  # asset_id; per-edge entity-ID ranges keep writes disjoint per
  # §Hero-scenario). Only projector-01 runs the edge_buffer_loop
  # (BUFFER_MONITOR_ENABLED gates it) — multi-edge buffer monitoring is
  # 6c rewire. telemetry_latest handler reads Provenance.edge_id from the
  # message; other handlers stay env-default in 6a.
  # =============================================================================
  openddil-projector-01:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-01
    environment:
      KAFKA_BROKERS:           redpanda-edge-01:9092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-01
      OPENDDIL_REGION_ID:      region-east
      BUFFER_MONITOR_ENABLED:  "true"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    ports:
      - "8084:8084"
    depends_on:
      redpanda-edge-01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-projector-02:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-02
    environment:
      KAFKA_BROKERS:           redpanda-edge-02:9092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-02
      OPENDDIL_REGION_ID:      region-east
      BUFFER_MONITOR_ENABLED:  "false"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-edge-02:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openddil-projector-03:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-03
    environment:
      KAFKA_BROKERS:           redpanda-edge-03:9092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-03
      OPENDDIL_REGION_ID:      region-west
      BUFFER_MONITOR_ENABLED:  "false"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-edge-03:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ADR-0023 Phase 6b §A: cm-service and logistics-fusion-service produce
  # asset-cm-state and asset-logistics-status to redpanda-hq (not per-edge,
  # because both are HQ-tier aggregated outputs in 6b). This 4th projector
  # instance consumes those HQ topics. Per-asset rows still UPSERT keyed by
  # asset_id; edge_id is read from the message-field provenance by the
  # cm_state / logistics_status handlers (Phase 6b §A switch).
  # BUFFER_MONITOR_ENABLED=false — only projector-01 runs the buffer
  # monitor.
  openddil-projector-hq:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-projector-hq
    environment:
      KAFKA_BROKERS:           redpanda-hq:19092
      POSTGRES_DSN:            postgres://postgres:password@postgres-hq:5432/openddil
      METRICS_PORT:            "8084"
      RATE_LIMIT_PER_SEC:      "10"
      LOG_LEVEL:               INFO
      PYTHONPATH:              /proto:/app/src
      OPENDDIL_EDGE_ID:        edge-unspecified
      OPENDDIL_REGION_ID:      region-unspecified
      BUFFER_MONITOR_ENABLED:  "false"
    volumes:
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-hq:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
      postgres-hq:
        condition: service_healthy
      atlas-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # =============================================================================
  # Releasability PDP + egress gate (ADR-0029 / ADR-0043, Arc 2 Slice 2)
  # =============================================================================
  # The chart has had a Topaz seat since 0.1.37; compose has not, which meant
  # the read gate's decisions could only ever be exercised on a cluster. Slice
  # 2's central claim is that egress and read evaluate ONE predicate, and a
  # claim about two components agreeing is untestable while only one of them
  # can be started. So the PDP comes to compose.
  #
  # NOT a second source of truth: policy/topaz-config.yaml copies the chart's
  # `topaz-hq-config` verbatim in every block that changes an answer, and the
  # bundle is assembled from the same three files the chart's init containers
  # copy. Only the transport differs — bind mounts here, an init-container
  # copy there.
  topaz:
    # PINNED to the same digest the chart pins, for the same reason: this
    # build REJECTS two config keys its own published schema documents, so
    # "whatever `latest` resolves to" and "the thing we verified" are not the
    # same component. See values.yaml releasability.topaz.image.
    image: ghcr.io/aserto-dev/topaz:0.33.16
    container_name: openddil-demo-topaz
    # THE PROVEN INVOCATION. `run` alone exits with
    #   required flag(s) "config-file" not set
    command: ["run", "--config-file", "/config/config.yaml"]
    ports:
      # 8383 is the authorizer's HTTP gateway — what pep.py and the egress
      # gate both POST to. Exposed on the host so the agreement test can ask
      # the same PDP the services ask, rather than a mock standing in for it.
      - "8383:8383"
    volumes:
      - ./policy/topaz-config.yaml:/config/config.yaml:ro
      - ./policy/.manifest:/policy/.manifest:ro
      - ./policy/releasability.rego:/policy/releasability.rego:ro
      # THE RENAME IS CALLED OUT HERE TOO, as it is in the chart and in
      # users.yaml's own header. The reviewed artifact is policy/users.yaml;
      # OPA's bundle convention names data files `data.yaml` and the
      # .manifest declares roots ["openddil"], so data outside that root is
      # refused outright. Same content, different name — said out loud,
      # because a silent rename in transport is how a reviewed file and a
      # running file drift apart.
      #
      # To exercise the other corpus, point this line at users-promoted.yaml
      # and recreate the container. That is compose's equivalent of the
      # chart's `kubectl set env ... OPENDDIL_POLICY_VARIANT=users-promoted`.
      - ./policy/users.yaml:/policy/openddil/data.yaml:ro
    # The directory store wants a writable path. Ephemeral on purpose: nothing
    # in Slice 1 or Slice 2 writes to the directory — entitlements are
    # asserted in the corpus, not stored as relationships — so persisting it
    # would preserve nothing and would let a stale db outlive a corpus change.
    tmpfs:
      - /db
    restart: unless-stopped

  # THE SINGLE BOUNDARY through which logistics status leaves this tier toward
  # a C2. Consumes asset-logistics-status, decides each record against ONE
  # destination's entitlement, forwards what is admitted to egress-c2-status
  # byte for byte, and writes a decision line for every record either way.
  #
  # COMPOSE-ONLY SCAFFOLDING. It borrows the projector image because that
  # image already carries confluent_kafka and protobuf and the gate needs
  # nothing else; the source is bind-mounted rather than baked. That is fine
  # for proving the decision and is NOT fine for anything that ships — a
  # component enforcing release must be built, pinned and mirrored like every
  # other. Ledger row LR-0043-C.
  egress-gate-c2:
    image: ghcr.io/edgy-solutions/openddil/projector:latest
    pull_policy: always
    container_name: openddil-demo-egress-gate-c2
    entrypoint: ["python", "-u", "/app/egress/main.py"]
    environment:
      OPENDDIL_EGRESS_BROKERS:      redpanda-hq:19092
      OPENDDIL_EGRESS_SOURCE_TOPIC: asset-logistics-status
      OPENDDIL_EGRESS_SINK_TOPIC:   egress-c2-status
      # The destination is a SUBJECT, not a fourth kind of thing: a system
      # principal with `nations`, declared in the same corpus the seats are
      # declared in. If this id is absent from the corpus the gate refuses
      # every record with `destination_unknown` — which is a broken link, not
      # a policy outcome, and is logged as its own reason so the two can
      # never be read as the same event.
      OPENDDIL_EGRESS_DESTINATION:  "system:c2-stand-in-atl"
      OPENDDIL_TOPAZ_URL:           http://topaz:8383
      LOG_LEVEL:                    INFO
      PYTHONPATH:                   /proto:/app
    volumes:
      - ./egress:/app/egress:ro
      - ../openddil-contracts/gen/python:/proto:ro
    depends_on:
      redpanda-hq:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      topaz:
        condition: service_started
    # `on-failure` and NOT `unless-stopped`: the gate exits non-zero when the
    # PDP will not answer, and a gate that silently restart-loops into a
    # working state is a gate whose outage nobody saw. Restarting on failure
    # is right; restarting after a clean stop is not.
    restart: on-failure

  frontend:
    image: ghcr.io/edgy-solutions/openddil/frontend:latest
    pull_policy: always
    container_name: openddil-demo-frontend
    ports:
      - "3017:80"

volumes:
  # The assembled /ontology. Rebuilt by ontology-overlay on every `up`, so it
  # is a cache of two source directories and never a place anything is
  # authored: `docker compose down -v` loses nothing.
  ontology: {}
