server {
    listen 80;
    server_name localhost;

    # Ensure proper MIME types for all assets
    include /etc/nginx/mime.types;

    # DNS resolver for the lazy (per-request) upstream resolution in the
    # /proxies/ and /electric/ blocks. nginx's `resolver` needs a literal
    # IP and cannot read /etc/resolv.conf itself; the right value differs
    # by environment (Docker embedded DNS 127.0.0.11 vs the k8s cluster
    # DNS). docker-entrypoint.d/40-resolver.sh substitutes __DNS_RESOLVER__
    # from /etc/resolv.conf at container start.
    resolver __DNS_RESOLVER__ valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have content hashes in filenames)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3D model GLBs ship in the frontend's own public/ dir — served
    # statically by `location /` above. Phase 4b removed the old
    # `location /models/` block that proxied these to the (now-deleted)
    # simulator container; the files were always frontend assets, the
    # proxy was a misroute.

    # Prevent caching of index.html so updates are immediate
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Deployment overlay (optional). A customer bundle mounts a ConfigMap
    # of deployment.json (+ a logo image, optional) at
    # /usr/share/nginx/html/deployment via the frontend Deployment. Absent
    # => the SPA falls back to OpenDDIL defaults. `=404` (not the SPA
    # fallback) so a missing deployment.json returns a clean 404, not
    # index.html.
    location /deployment/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Toxiproxy control API. Lazy upstream resolution: the hostname goes in
    # a variable so nginx resolves it per-request via the resolver above,
    # NOT once at startup. Before Phase 4b, a missing upstream (e.g. the
    # simulator on its disabled profile) failed `nginx -t` at boot and
    # killed the whole frontend container. Now a down upstream just yields
    # a 502 for that route; the container stays up and every other route
    # keeps serving.
    location /proxies/ {
        # __SVC_SUFFIX__ is substituted by docker-entrypoint.d/40-resolver.sh:
        # empty on compose (Docker DNS resolves bare names), or
        # `.<ns>.svc.cluster.local` on k8s (nginx's `resolver` ignores the
        # client's /etc/resolv.conf search list, so the FQDN is required).
        set $upstream_toxiproxy "toxiproxy__SVC_SUFFIX__";
        proxy_pass http://$upstream_toxiproxy:8475$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent "Toxiproxy-UI";
    }

    # ElectricSQL shape API (browser-direct, same-origin). The Vite build
    # uses VITE_ELECTRIC_URL=/electric/v1/shape by default (frontend/
    # Dockerfile ARG) so the browser hits THIS location and nginx proxies
    # to electric-sync. Same lazy-resolution pattern as /proxies/ — a
    # down electric-sync yields 502s on shape requests instead of killing
    # the container.
    #
    # The short hostname `electric-sync` matches docker-compose's container
    # name. On k8s, the openddil-helm chart creates an alias Service of
    # the same short name (parallel to its existing `toxiproxy` alias)
    # so resolution is identical across both environments.
    #
    # rewrite strips the /electric prefix; upstream receives /v1/shape?...
    # which is what electric-sync expects.
    #
    # IMPORTANT: when proxy_pass uses a variable host, nginx does NOT
    # automatically carry the rewritten URI — it falls back to the original
    # request URI, which would send /electric/v1/shape upstream and get a
    # 404 (electric serves /v1/shape, not /electric/v1/shape). Spelling out
    # $uri$is_args$args makes nginx use the post-rewrite URI explicitly.
    # The /proxies/ block above gets this right via $request_uri because
    # toxiproxy's API *does* live under /proxies/ — no prefix strip needed.
    location /electric/ {
        # See /proxies/ block above for __SVC_SUFFIX__ rationale.
        set $upstream_electric "electric-sync__SVC_SUFFIX__";
        rewrite ^/electric/(.*)$ /$1 break;
        proxy_pass http://$upstream_electric:5133$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Shape responses can be large + long-polling — disable buffering
        # so the client sees incremental data, lift the read timeout so
        # idle long-polls don't get cut.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Phase 4b removed the /api/ proxy (-> faust-edge:6066) and the
    # /simulator/ proxy (-> simulator:8000). faust-edge never served an
    # HTTP API, App.tsx no longer polls /api/*, and the simulator service
    # is gone. Live data flow:
    #   * Compose: VITE_ELECTRIC_URL=http://localhost:5133/v1/shape, the
    #     browser reaches electric-sync directly on the host port (the
    #     /electric/ proxy block above is unused in this mode but harmless).
    #   * Helm: VITE_ELECTRIC_URL=/electric/v1/shape, browser → frontend
    #     ingress → frontend nginx /electric/ proxy → in-cluster electric-
    #     sync. Same-origin, no CORS, no separate ingress for electric.
}
