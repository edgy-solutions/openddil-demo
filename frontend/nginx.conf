server {
    listen 80;
    server_name localhost;

    # Ensure proper MIME types for all assets
    include /etc/nginx/mime.types;

    # DNS resolver for the lazy (per-request) upstream resolution in the
    # /proxies/ and /electric/ blocks. nginx's `resolver` needs a literal
    # IP and cannot read /etc/resolv.conf itself; the right value differs
    # by environment (Docker embedded DNS 127.0.0.11 vs the k8s cluster
    # DNS). docker-entrypoint.d/40-resolver.sh substitutes __DNS_RESOLVER__
    # from /etc/resolv.conf at container start.
    resolver __DNS_RESOLVER__ valid=10s ipv6=off;


    # ---------------------------------------------------------------------
    # SESSION GATE — the shell itself requires a session
    # ---------------------------------------------------------------------
    # The gateway guarded the DATA paths and left the static shell public,
    # so an unauthenticated visitor got the whole application: the tier id,
    # the parent relationship, the panel inventory and the buffer state,
    # all before any decision had been made about who was looking. For a
    # coalition system that is topology and capability structure leaking to
    # anyone who can reach the host.
    #
    # It also produced a dishonest screen: every panel read "Syncing…"
    # because its shape request was coming back 401, which says "data is on
    # its way" when the truth is "you are not signed in".
    #
    # `auth_request` asks the PEP's /auth/me before serving the shell. The
    # PEP is the only thing that can answer — the session is an httpOnly
    # cookie the browser cannot read and nginx must not try to interpret.
    #
    # ⚠ SUBSTITUTED, NOT UNCONDITIONAL. With no PEP, /auth/me is a 502; in
    # header mode it is a 404. auth_request turns any non-2xx that is not
    # 401/403 into a 500, so an unconditional gate would take the whole app
    # down exactly where there is nothing to log in to. The chart sets
    # OPENDDIL_SESSION_GATE from the SAME condition that puts the PEP in
    # oidc mode, so the gate and the thing that can satisfy it arrive
    # together or not at all.
    location = /_session_check {
        internal;
        set $upstream_pep_check "__PEP_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_pep_check:8080/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Where an unauthenticated request for the shell goes. A redirect, not a
    # 401 body: the browser asked for a page, so it gets sent to the login
    # rather than shown a bare status.
    location @signin {
        return 302 /auth/login;
    }

    location / {
        __SESSION_GATE__
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Built-in OpenDDIL brand images (logo, favicon, sign-in background).
    # DELIBERATELY NOT GATED — SIGN-IN BRANDING.
    #
    # These live in public/brand/ and would otherwise be served by
    # `location /`, which IS gated. Without this block the sign-in screen
    # cannot load its own logo: the request is redirected to the login it is
    # already showing, and the mark renders as a broken image. Found by
    # curling the gated deployment rather than by reading the config, which
    # had a comment claiming assets stayed public while this file was one of
    # them.
    #
    # `^~ /brand/` is a prefix, not two exact matches, because (unlike the
    # formerly-loose files it replaces) everything under public/brand/ is a
    # baked-in default image meant to be public — same reasoning as the
    # /branding/ block below. `=404` so a missing file is a clean 404, not
    # the SPA's index.html fallback.
    #
    # /brand/ = baked-in OpenDDIL defaults shipped in the image; /branding/
    # (below) = optional deploy-time ConfigMap overlay. Distinct prefixes on
    # purpose so the two can never collide.
    location ^~ /brand/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1h;
    }

    # Deploy-time branding overlay (optional). A directory mounted at
    # /usr/share/nginx/html/branding/ holds branding.json ({title?, logo?})
    # and optional image files; the frontend applies them over
    # deployment.json's title/logo via applyBranding(). Absent/empty dir =>
    # today's behaviour, unchanged.
    #
    # DELIBERATELY NOT GATED, same reasoning as the /brand/ block
    # above: the sign-in screen must show the deployment's brand before any
    # session exists. This is safe to leave open because the file schema
    # carries only title and logo, never topology — and applyBranding() on
    # the client only ever reads those two keys off it, so even a
    # maliciously-crafted branding.json cannot smuggle fobs/map/tier/
    # liveness into a running app. `^~` (not a regex location) so no later
    # regex location can intercept /branding/logo.png; `=404` so a missing
    # file is a clean 404, not the SPA's index.html fallback.
    location ^~ /branding/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # DELIBERATELY NOT GATED. The compiled bundle is identical for every
    # tier and carries no topology; and a sign-in screen that cannot load
    # its own stylesheet is a worse failure than a public asset.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3D model GLBs, when any are registered in AssetVisual's GLB_REGISTRY,
    # ship in the frontend's own public/models/ dir and are served
    # statically by `location /` above. No dedicated `location /models/`
    # block is needed.

    # Prevent caching of index.html so updates are immediate
    location = /index.html {
        __SESSION_GATE__
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Deployment overlay (optional). A customer bundle mounts a ConfigMap
    # of deployment.json (+ a logo image, optional) at
    # /usr/share/nginx/html/deployment via the frontend Deployment. Absent
    # => the SPA falls back to OpenDDIL defaults. `=404` (not the SPA
    # fallback) so a missing deployment.json returns a clean 404, not
    # index.html.
    location /deployment/ {
        # GATED TOO, and this is the one that matters for the leak: the tier
        # id and the parent relationship live in this file, so leaving it
        # open would publish the topology even with the shell closed.
        __SESSION_GATE__
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # /proxies/ — the WAN-link toggle, reached through the PEP
    # ---------------------------------------------------------------------
    # This used to proxy straight to the DDIL sever mechanism's control API
    # with no session and no role check: anyone who could reach the
    # frontend could cut or restore the uplink. It now goes through the
    # same gateway as /auth/ and /cm/ below — the PEP enforces the session
    # and the WAN-control role (gateway/pep.py's _handle_wan_control)
    # before anything is forwarded; both GET and POST are gated, since
    # reading the link's state is a capability too.
    #
    # Same upstream idiom as /auth/ below, port 8080, NO path rewrite —
    # the PEP serves GET/POST /proxies/hq-link at exactly that path.
    # Cookie, Origin and Content-Type are forwarded like the other PEP
    # locations: nginx passes a header through unchanged unless a
    # directive here clears or overrides it, and none does.
    #
    # The old block rewrote the browser's User-Agent to a fixed string,
    # because the sever mechanism refuses browser user agents; the PEP now
    # carries that defence itself under its own name, so this proxy no
    # longer needs to rewrite the browser's User-Agent at all.
    location /proxies/ {
        set $upstream_pep "__PEP_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_pep:8080$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Exercise control (GET /exercise/status, POST /exercise/op/<op>) —
    # same idiom as /proxies/ immediately above: no path rewrite, the PEP
    # serves these two paths at exactly this prefix, and role-gating (plus
    # the 404-when-unconfigured default) happens entirely in the PEP, not
    # here. This location exists so the browser has a same-origin route to
    # it; it carries no opinion about the simulator's state itself.
    location /exercise/ {
        set $upstream_pep "__PEP_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_pep:8080$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ElectricSQL shape API (browser-direct, same-origin). The Vite build
    # uses VITE_ELECTRIC_URL=/electric/v1/shape by default (frontend/
    # Dockerfile ARG) so the browser hits THIS location and nginx proxies
    # to electric-sync. Same lazy-resolution pattern as /proxies/ — a
    # down electric-sync yields 502s on shape requests instead of killing
    # the container.
    #
    # The short hostname `electric-sync` matches docker-compose's container
    # name. On k8s, the openddil-helm chart creates an alias Service of
    # the same short name so resolution is identical across both
    # environments.
    #
    # rewrite strips the /electric prefix; upstream receives /v1/shape?...
    # which is what electric-sync expects.
    #
    # IMPORTANT: when proxy_pass uses a variable host, nginx does NOT
    # automatically carry the rewritten URI — it falls back to the original
    # request URI, which would send /electric/v1/shape upstream and get a
    # 404 (electric serves /v1/shape, not /electric/v1/shape). Spelling out
    # $uri$is_args$args makes nginx use the post-rewrite URI explicitly.
    # The /proxies/ block above uses the same $uri$is_args$args idiom —
    # no prefix strip needed there either, since the PEP serves
    # /proxies/hq-link at exactly that path.
    # THE READ PATH. `__ELECTRIC_UPSTREAM__` is substituted at container start
    # (docker-entrypoint.d/40-resolver.sh) from OPENDDIL_ELECTRIC_UPSTREAM.
    #
    # It points at Electric directly when releasability enforcement is OFF,
    # and at the PEP when it is ON. That is the whole insertion: the browser
    # keeps requesting the same same-origin path, so the session cookie rides
    # along with no CORS and no frontend change, and the filtering happens
    # somewhere the browser cannot address.
    #
    # ⚠ POINTING THIS AT ELECTRIC WHILE ENFORCEMENT IS ON IS A COMPLETE
    # BYPASS, and it would look like everything working. The chart sets both
    # this and the NetworkPolicy from the same value for that reason: with
    # `lockDownElectric` on, Electric refuses connections from anything but
    # the PEP, so a mis-set upstream fails loudly instead of serving every
    # nation's rows to everyone.
    location /electric/ {
        # See /proxies/ block above for __SVC_SUFFIX__ rationale.
        set $upstream_electric "__ELECTRIC_UPSTREAM____SVC_SUFFIX__";
        rewrite ^/electric/(.*)$ /$1 break;
        proxy_pass http://$upstream_electric:__ELECTRIC_PORT__$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Shape responses can be large + long-polling — disable buffering
        # so the client sees incremental data, lift the read timeout so
        # idle long-polls don't get cut.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Egress admission pane API (same-origin, session-gated). The pane shows
    # per-record release decisions — asset ids, originator nations — the same
    # class of data `location /` is gated to protect, so this location
    # carries __SESSION_GATE__ too: an unauthenticated visitor must not be
    # able to read what would be released to a destination nation just
    # because they can reach the frontend host.
    #
    # SAME-ORIGIN ON PURPOSE. useEgressAdmission.ts used to fetch a
    # cross-origin `http://localhost:8090` directly, which (a) reaches the
    # wrong pane on a workstation running more than one stack under Docker
    # Desktop, and (b) if reachable through an Ingress instead, would bypass
    # this gate entirely — a direct path to the pane is a direct path around
    # __SESSION_GATE__. Routing it through this nginx like /electric/ and
    # /auth/ means one gate covers the shell, the read path, and the egress
    # pane alike.
    #
    # IN A PEP DEPLOYMENT THE REQUEST GOES TO THE PEP, PATH UNCHANGED.
    # The pane answers once, for every nation on the wire — see
    # egress/pane_api.py — so the pane itself cannot be the thing a browser
    # talks to directly once a session gate exists: it has nothing to narrow
    # its answer by viewer. `/egress/decisions` is forwarded to the PEP
    # exactly as the browser sent it, and the PEP asks Topaz which nations
    # THIS viewer holds and filters the pane's answer down to them
    # (gateway/egress_view.py) before it ever reaches the response. A direct
    # pane behind this location (no rewrite, pane's own host) is only correct
    # for an UNGATED stack — compose, where there is no session and no PEP to
    # route through.
    #
    # HUB-ONLY. A pane or a PEP to reach one only exists where
    # `releasability.enabled` renders this tier's PEP/egress-pane-api. Tier
    # frontends never get an upstream for this location, so 40-resolver.sh
    # replaces __EGRESS_PANE_OFF__ with a 404 instead of leaving a location
    # that resolves nothing (a variable upstream with no resolvable host
    # fails as a 502, which would look like an outage rather than "not at
    # this tier").
    #
    # __EGRESS_PANE_REWRITE__ is substituted by 40-resolver.sh: empty when
    # going through the PEP (the PEP's own route expects
    # `/egress/decisions`, so the path must NOT be stripped), or the
    # `/egress` prefix strip when going straight to the pane (compose),
    # which serves /decisions and /healthz at its own root. Same
    # $uri$is_args$args idiom as /electric/ above: proxy_pass with a
    # variable host does not carry the rewritten URI on its own.
    location /egress/ {
        __SESSION_GATE__
        __EGRESS_PANE_OFF__
        set $upstream_egress_pane "__EGRESS_PANE_UPSTREAM____SVC_SUFFIX__";
        __EGRESS_PANE_REWRITE__
        proxy_pass http://$upstream_egress_pane:__EGRESS_PANE_PORT__$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Phase 4b removed the /api/ proxy (-> faust-edge:6066) and the
    # /simulator/ proxy (-> simulator:8000). faust-edge never served an
    # HTTP API, App.tsx no longer polls /api/*, and the simulator service
    # is gone. Live data flow:
    #   * Compose: VITE_ELECTRIC_URL=http://localhost:5133/v1/shape, the
    #     browser reaches electric-sync directly on the host port (the
    #     /electric/ proxy block above is unused in this mode but harmless).
    #   * Helm: VITE_ELECTRIC_URL=/electric/v1/shape, browser → frontend
    #     ingress → frontend nginx /electric/ proxy → in-cluster electric-
    #     sync. Same-origin, no CORS, no separate ingress for electric.

    # ---------------------------------------------------------------------
    # /auth/ — the backend-for-frontend's login routes
    # ---------------------------------------------------------------------
    # Same origin as the app, deliberately: the session cookie is set on a
    # same-site response and sent on same-site requests, so no CORS is
    # involved anywhere in the login round trip.
    #
    # The path is NOT rewritten. The PEP serves /auth/login, /auth/callback,
    # /auth/logout and /auth/me at exactly those paths, and /auth/callback in
    # particular must match the redirect URI registered with the identity
    # provider EXACTLY — an exact redirect URI is the thing that stops an
    # authorization code being delivered somewhere else, and a rewrite here
    # would quietly break the match.
    #
    # In header mode the PEP answers these with 404 rather than pretending;
    # if the PEP is not deployed at all this returns 502, which is correct —
    # a login route that cannot reach its gateway must not appear to work.
    location /auth/ {
        set $upstream_pep "__PEP_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_pep:8080$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The IdP redirect and the Set-Cookie both travel through here.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # /cm/ — the PEP's configuration-management write path
    # ---------------------------------------------------------------------
    # GET /cm/fault-codes and POST /cm/discrepancy, both session-gated like
    # the read path: a fault report names a component and a server-defined
    # fault code against a specific asset, which is exactly the class of
    # data /electric/ and /egress/ are already gated to protect — an
    # unauthenticated visitor must not be able to probe the fault-code
    # catalog or file a report just because they can reach the frontend
    # host. Same __SESSION_GATE__ idiom as /egress/ above.
    #
    # NO REWRITE: the PEP serves /cm/fault-codes and /cm/discrepancy at
    # exactly those paths, same reasoning as /auth/ above.
    #
    # THIS IS THE FIRST WRITE LOCATION. Every other proxied location here
    # is a read (or, for /auth/, a login redirect) — /cm/discrepancy is the
    # first POST that mutates state on the other side of this proxy. In
    # compose there is no PEP, so this answers 502 and FaultReportForm's
    # loadFaultCodes() treats that as "feature off" and the form stays
    # hidden — same as 404/401, see lib/cmReport.ts.
    #
    # client_max_body_size 16k: a discrepancy body is a few short strings
    # (asset_id, component, fault_code, a <=500-char description) — 16k is
    # already generous headroom, and capping it here means an oversized
    # request is rejected by nginx before it reaches the PEP at all.
    location /cm/ {
        __SESSION_GATE__
        set $upstream_pep "__PEP_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_pep:8080$uri$is_args$args;
        client_max_body_size 16k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A WRITE MUST NOT TAKE ITS SUBJECT FROM THE BROWSER. In header mode
        # the PEP reads the subject from X-OpenDDIL-Subject, which a browser
        # can set to anything; clearing it here means header mode cannot
        # write through this proxy at all (401), and only an OIDC session
        # names the reporter.
        proxy_set_header X-OpenDDIL-Subject "";
    }

    # ---------------------------------------------------------------------
    # /manual/ — the manual question service, reached through the PEP
    # ---------------------------------------------------------------------
    # COMPOSE-ONLY. No chart wiring exists for this route at all — the
    # chart build never sets OPENDDIL_MANUAL_ASK_UPSTREAM, so
    # __MANUAL_ASK_OFF__ is always substituted with a literal 404 there.
    # This location never resolves an upstream in a chart deployment, same
    # reasoning as /egress/'s mode (d) above: a variable upstream with
    # nothing to resolve fails as a 502, which would look like an outage
    # rather than "not shipped here".
    #
    # NO REWRITE: the PEP serves /manual/ask at exactly that path, same
    # reasoning as /auth/ and /cm/ above. Session-gated like /cm/ — a
    # maintainer's question names a specific asset, the same class of data
    # /cm/ is already gated to protect.
    #
    # A SEPARATE upstream variable from /auth/ and /cm/'s __PEP_UPSTREAM__,
    # on purpose: this route's compose wiring (a bare `python pep.py`
    # service — see docker-compose.yml's `gateway`) is new, and reusing
    # __PEP_UPSTREAM__ would make standing this route up in compose
    # silently change /auth/ and /cm/'s own (currently dormant) behaviour
    # too — a side effect nobody asked for.
    #
    # client_max_body_size 16k: a question is at most 1000 chars and the
    # scope at most 20 short DMC strings — 16k is already generous
    # headroom, matching /cm/'s own limit for a comparably small body.
    #
    # DEV IDENTITY, COMPOSE-ONLY. Compose has no session and no other
    # mechanism that names a signed-in subject — see /cm/'s own
    # X-OpenDDIL-Subject above, which is CLEARED rather than set, for
    # exactly that reason. The subject comes from
    # OPENDDIL_MANUAL_ASK_DEV_SUBJECT, which only docker-compose.yml sets;
    # unset, 40-resolver.sh substitutes "" and the header is cleared as on
    # /cm/. No identity is baked into the image.
    location /manual/ {
        __SESSION_GATE__
        __MANUAL_ASK_OFF__
        set $upstream_manual_ask "__MANUAL_ASK_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_manual_ask:__MANUAL_ASK_PORT__$uri$is_args$args;
        client_max_body_size 16k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # COMPOSE-ONLY dev identity -- see the location comment above.
        proxy_set_header X-OpenDDIL-Subject "__MANUAL_ASK_DEV_SUBJECT__";
    }
}
