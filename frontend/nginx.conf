server {
    listen 80;
    server_name localhost;

    # Ensure proper MIME types for all assets
    include /etc/nginx/mime.types;

    # DNS resolver for the lazy (per-request) upstream resolution in the
    # /proxies/ and /electric/ blocks. nginx's `resolver` needs a literal
    # IP and cannot read /etc/resolv.conf itself; the right value differs
    # by environment (Docker embedded DNS 127.0.0.11 vs the k8s cluster
    # DNS). docker-entrypoint.d/40-resolver.sh substitutes __DNS_RESOLVER__
    # from /etc/resolv.conf at container start.
    resolver __DNS_RESOLVER__ valid=10s ipv6=off;


    # ---------------------------------------------------------------------
    # SESSION GATE — the shell itself requires a session
    # ---------------------------------------------------------------------
    # The gateway guarded the DATA paths and left the static shell public,
    # so an unauthenticated visitor got the whole application: the tier id,
    # the parent relationship, the panel inventory and the buffer state,
    # all before any decision had been made about who was looking. For a
    # coalition system that is topology and capability structure leaking to
    # anyone who can reach the host.
    #
    # It also produced a dishonest screen: every panel read "Syncing…"
    # because its shape request was coming back 401, which says "data is on
    # its way" when the truth is "you are not signed in".
    #
    # `auth_request` asks the PEP's /auth/me before serving the shell. The
    # PEP is the only thing that can answer — the session is an httpOnly
    # cookie the browser cannot read and nginx must not try to interpret.
    #
    # ⚠ SUBSTITUTED, NOT UNCONDITIONAL. With no PEP, /auth/me is a 502; in
    # header mode it is a 404. auth_request turns any non-2xx that is not
    # 401/403 into a 500, so an unconditional gate would take the whole app
    # down exactly where there is nothing to log in to. The chart sets
    # OPENDDIL_SESSION_GATE from the SAME condition that puts the PEP in
    # oidc mode, so the gate and the thing that can satisfy it arrive
    # together or not at all.
    location = /_session_check {
        internal;
        set $upstream_pep_check "__PEP_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_pep_check:8080/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Where an unauthenticated request for the shell goes. A redirect, not a
    # 401 body: the browser asked for a page, so it gets sent to the login
    # rather than shown a bare status.
    location @signin {
        return 302 /auth/login;
    }

    location / {
        __SESSION_GATE__
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have content hashes in filenames)
    # DELIBERATELY NOT GATED — SIGN-IN BRANDING.
    #
    # These live in public/ and are therefore served by `location /`, which
    # IS gated. Without these exact matches the sign-in screen cannot load
    # its own logo: the request is redirected to the login it is already
    # showing, and the mark renders as a broken image. Found by curling the
    # gated deployment rather than by reading the config, which had a
    # comment claiming assets stayed public while this file was one of them.
    #
    # Narrow on purpose: two exact paths, not a prefix. A prefix here would
    # quietly re-open `location /` for anything anyone dropped in public/.
    location = /openddil.jpg {
        root /usr/share/nginx/html;
        expires 1h;
    }
    location = /favicon.svg {
        root /usr/share/nginx/html;
        expires 1h;
    }

    # DELIBERATELY NOT GATED. The compiled bundle is identical for every
    # tier and carries no topology; and a sign-in screen that cannot load
    # its own stylesheet is a worse failure than a public asset.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3D model GLBs ship in the frontend's own public/ dir — served
    # statically by `location /` above. Phase 4b removed the old
    # `location /models/` block that proxied these to the (now-deleted)
    # simulator container; the files were always frontend assets, the
    # proxy was a misroute.

    # Prevent caching of index.html so updates are immediate
    location = /index.html {
        __SESSION_GATE__
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Deployment overlay (optional). A customer bundle mounts a ConfigMap
    # of deployment.json (+ a logo image, optional) at
    # /usr/share/nginx/html/deployment via the frontend Deployment. Absent
    # => the SPA falls back to OpenDDIL defaults. `=404` (not the SPA
    # fallback) so a missing deployment.json returns a clean 404, not
    # index.html.
    location /deployment/ {
        # GATED TOO, and this is the one that matters for the leak: the tier
        # id and the parent relationship live in this file, so leaving it
        # open would publish the topology even with the shell closed.
        __SESSION_GATE__
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Toxiproxy control API. Lazy upstream resolution: the hostname goes in
    # a variable so nginx resolves it per-request via the resolver above,
    # NOT once at startup. Before Phase 4b, a missing upstream (e.g. the
    # simulator on its disabled profile) failed `nginx -t` at boot and
    # killed the whole frontend container. Now a down upstream just yields
    # a 502 for that route; the container stays up and every other route
    # keeps serving.
    location /proxies/ {
        # __SVC_SUFFIX__ is substituted by docker-entrypoint.d/40-resolver.sh:
        # empty on compose (Docker DNS resolves bare names), or
        # `.<ns>.svc.cluster.local` on k8s (nginx's `resolver` ignores the
        # client's /etc/resolv.conf search list, so the FQDN is required).
        set $upstream_toxiproxy "toxiproxy__SVC_SUFFIX__";
        proxy_pass http://$upstream_toxiproxy:8475$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent "Toxiproxy-UI";
    }

    # ElectricSQL shape API (browser-direct, same-origin). The Vite build
    # uses VITE_ELECTRIC_URL=/electric/v1/shape by default (frontend/
    # Dockerfile ARG) so the browser hits THIS location and nginx proxies
    # to electric-sync. Same lazy-resolution pattern as /proxies/ — a
    # down electric-sync yields 502s on shape requests instead of killing
    # the container.
    #
    # The short hostname `electric-sync` matches docker-compose's container
    # name. On k8s, the openddil-helm chart creates an alias Service of
    # the same short name (parallel to its existing `toxiproxy` alias)
    # so resolution is identical across both environments.
    #
    # rewrite strips the /electric prefix; upstream receives /v1/shape?...
    # which is what electric-sync expects.
    #
    # IMPORTANT: when proxy_pass uses a variable host, nginx does NOT
    # automatically carry the rewritten URI — it falls back to the original
    # request URI, which would send /electric/v1/shape upstream and get a
    # 404 (electric serves /v1/shape, not /electric/v1/shape). Spelling out
    # $uri$is_args$args makes nginx use the post-rewrite URI explicitly.
    # The /proxies/ block above gets this right via $request_uri because
    # toxiproxy's API *does* live under /proxies/ — no prefix strip needed.
    # THE READ PATH. `__ELECTRIC_UPSTREAM__` is substituted at container start
    # (docker-entrypoint.d/40-resolver.sh) from OPENDDIL_ELECTRIC_UPSTREAM.
    #
    # It points at Electric directly when releasability enforcement is OFF,
    # and at the PEP when it is ON. That is the whole insertion: the browser
    # keeps requesting the same same-origin path, so the session cookie rides
    # along with no CORS and no frontend change, and the filtering happens
    # somewhere the browser cannot address.
    #
    # ⚠ POINTING THIS AT ELECTRIC WHILE ENFORCEMENT IS ON IS A COMPLETE
    # BYPASS, and it would look like everything working. The chart sets both
    # this and the NetworkPolicy from the same value for that reason: with
    # `lockDownElectric` on, Electric refuses connections from anything but
    # the PEP, so a mis-set upstream fails loudly instead of serving every
    # nation's rows to everyone.
    location /electric/ {
        # See /proxies/ block above for __SVC_SUFFIX__ rationale.
        set $upstream_electric "__ELECTRIC_UPSTREAM____SVC_SUFFIX__";
        rewrite ^/electric/(.*)$ /$1 break;
        proxy_pass http://$upstream_electric:__ELECTRIC_PORT__$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Shape responses can be large + long-polling — disable buffering
        # so the client sees incremental data, lift the read timeout so
        # idle long-polls don't get cut.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Phase 4b removed the /api/ proxy (-> faust-edge:6066) and the
    # /simulator/ proxy (-> simulator:8000). faust-edge never served an
    # HTTP API, App.tsx no longer polls /api/*, and the simulator service
    # is gone. Live data flow:
    #   * Compose: VITE_ELECTRIC_URL=http://localhost:5133/v1/shape, the
    #     browser reaches electric-sync directly on the host port (the
    #     /electric/ proxy block above is unused in this mode but harmless).
    #   * Helm: VITE_ELECTRIC_URL=/electric/v1/shape, browser → frontend
    #     ingress → frontend nginx /electric/ proxy → in-cluster electric-
    #     sync. Same-origin, no CORS, no separate ingress for electric.

    # ---------------------------------------------------------------------
    # /auth/ — the backend-for-frontend's login routes
    # ---------------------------------------------------------------------
    # Same origin as the app, deliberately: the session cookie is set on a
    # same-site response and sent on same-site requests, so no CORS is
    # involved anywhere in the login round trip.
    #
    # The path is NOT rewritten. The PEP serves /auth/login, /auth/callback,
    # /auth/logout and /auth/me at exactly those paths, and /auth/callback in
    # particular must match the redirect URI registered with the identity
    # provider EXACTLY — an exact redirect URI is the thing that stops an
    # authorization code being delivered somewhere else, and a rewrite here
    # would quietly break the match.
    #
    # In header mode the PEP answers these with 404 rather than pretending;
    # if the PEP is not deployed at all this returns 502, which is correct —
    # a login route that cannot reach its gateway must not appear to work.
    location /auth/ {
        set $upstream_pep "__PEP_UPSTREAM____SVC_SUFFIX__";
        proxy_pass http://$upstream_pep:8080$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The IdP redirect and the Set-Cookie both travel through here.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
